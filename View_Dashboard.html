<style>
/* =========================================================
   DASHBOARD V2 FINAL - UNGU SIDEBAR + SLIDE SAMPING + AIR
   ========================================================= */
:root {
  --neo-soft-raised: 6px 6px 16px rgba(163,177,198,0.45), -6px -6px 16px rgba(255,255,255,0.85);
  --neo-soft-raised-lg: 10px 10px 30px rgba(163,177,198,0.4), -8px -8px 24px rgba(255,255,255,0.9);
  --neo-soft-inset: inset 5px 5px 12px rgba(163,177,198,0.5), inset -5px -5px 12px rgba(255,255,255,0.9);
  --neo-soft-flat: 3px 3px 8px rgba(163,177,198,0.35), -3px -3px 8px rgba(255,255,255,0.8);
}

.dash-layout-v2 { display:flex; flex-direction:column; height:100%; overflow-y:auto; padding-right:8px; gap:22px; }
.dash-layout-v2::-webkit-scrollbar { width:6px; }
.dash-layout-v2::-webkit-scrollbar-thumb { background:rgba(163,177,198,0.4); border-radius:10px; }

.dash-header-v2 { display:flex; justify-content:space-between; align-items:center; }
.page-title-v2 { font-size:1.5rem; font-weight:800; color:var(--neo-text-heading); margin:0; }
.page-subtitle-v2 { font-size:0.85rem; color:var(--neo-text-sub); margin:4px 0 0 0; }
.header-right { display:flex; align-items:center; gap:14px; }
.search-box-v2 { position:relative; background:var(--neo-surface); border-radius:99px; padding:8px 16px; box-shadow:var(--neo-soft-inset); display:flex; align-items:center; gap:10px; width:200px; }
.search-box-v2 i { color:var(--neo-text-muted); font-size:0.9rem; }
.search-box-v2 input { border:none; background:transparent; outline:none; font-size:0.85rem; color:var(--neo-text-heading); width:100%; font-weight:600; }

/* CTA: ungu solid sama dengan aksen sidebar */
.btn-cta-neo { display:flex; align-items:center; gap:8px; border:none; cursor:pointer; padding:11px 20px; border-radius:999px; background:var(--neo-accent); color:#fff; font-weight:800; font-size:0.8rem; letter-spacing:0.2px; box-shadow:0 6px 16px rgba(102,126,234,0.4); animation:ctaBreath 2.6s ease-in-out infinite; transition:transform 0.2s; }
.btn-cta-neo:hover { transform:translateY(-2px); }
.btn-cta-neo:active { transform:translateY(0); box-shadow:var(--neo-soft-inset); animation:none; }
@keyframes ctaBreath { 0%,100% { box-shadow:0 6px 14px rgba(102,126,234,0.35); } 50% { box-shadow:0 8px 24px rgba(102,126,234,0.6); } }

.user-avatar-v2 { width:42px; height:42px; border-radius:50%; background:var(--neo-surface); box-shadow:var(--neo-soft-raised); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--neo-text-heading); }

.dash-grid-v2 { display:grid; grid-template-columns:1.5fr 1fr; gap:22px; align-items:stretch; }
.dash-col-left { display:flex; flex-direction:column; gap:22px; min-width:0; }
.dash-col-right { display:flex; flex-direction:column; min-width:0; }

.card-hero-neo { background:var(--neo-surface); border-radius:28px; padding:22px; box-shadow:var(--neo-soft-raised-lg); display:flex; flex-direction:column; }
.hero-top { margin-bottom:14px; }
.hero-label { font-size:0.8rem; font-weight:700; color:var(--neo-text-sub); text-transform:uppercase; letter-spacing:1px; }
.hero-visual { display:flex; align-items:center; gap:26px; }
.ring-container { position:relative; width:135px; height:135px; flex-shrink:0; }
.ring-container svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-pct { font-size:1.8rem; font-weight:800; color:var(--neo-text-heading); line-height:1; }
.ring-sub { font-size:0.6rem; color:var(--neo-text-sub); text-transform:uppercase; letter-spacing:1px; margin-top:4px; font-weight:700; }

.bars-area { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
.bars-title { font-size:0.65rem; font-weight:700; color:var(--neo-text-sub); text-transform:uppercase; letter-spacing:0.5px; }
.mini-bars { display:flex; align-items:flex-end; gap:7px; height:80px; }

/* Bar air: track inset, fill = air dengan gelombang bergoyang */
.mc-bar { flex:1; height:100%; background:var(--neo-surface); border-radius:6px; box-shadow:var(--neo-soft-inset); position:relative; overflow:hidden; }
.mc-bar-fill { position:absolute; bottom:0; left:0; right:0; border-radius:0 0 6px 6px; background:linear-gradient(180deg,#4fd1c5 0%,#48bb78 100%); height:0%; transition:height 0.9s cubic-bezier(0.4,0,0.2,1); }
.mc-bar-fill.today { background:linear-gradient(180deg,#7c9cf5 0%,#667eea 100%); }

/* Gelombang utama (permukaan air) */
.mc-bar-fill::before {
  content:''; position:absolute; top:-8px; left:0; width:200%; height:10px;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2010'%20preserveAspectRatio='none'%3E%3Cpath%20d='M0%205%20Q%207.5%200%2015%205%20T%2030%205%20T%2045%205%20T%2060%205%20V%2010%20H%200%20Z'%20fill='%2348bb78'/%3E%3C/svg%3E") repeat-x;
  background-size:60px 10px;
  animation:waveMove 2.4s linear infinite, waveBob 3.2s ease-in-out infinite;
}
.mc-bar-fill.today::before {
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2010'%20preserveAspectRatio='none'%3E%3Cpath%20d='M0%205%20Q%207.5%200%2015%205%20T%2030%205%20T%2045%205%20T%2060%205%20V%2010%20H%200%20Z'%20fill='%23667eea'/%3E%3C/svg%3E");
}
/* Gelombang kedua (kilau air, lebih pelan & transparan) */
.mc-bar-fill::after {
  content:''; position:absolute; top:-6px; left:0; width:200%; height:10px; opacity:0.45;
  background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2060%2010'%20preserveAspectRatio='none'%3E%3Cpath%20d='M0%205%20Q%207.5%2010%2015%205%20T%2030%205%20T%2045%205%20T%2060%205%20V%2010%20H%200%20Z'%20fill='%23ffffff'/%3E%3C/svg%3E") repeat-x;
  background-size:80px 10px;
  animation:waveMoveRev 3.6s linear infinite, waveBob 2.7s ease-in-out infinite;
}
@keyframes waveMove { from { background-position-x:0; } to { background-position-x:120px; } }
@keyframes waveMoveRev { from { background-position-x:0; } to { background-position-x:-160px; } }
@keyframes waveBob { 0%,100% { top:-8px; } 50% { top:-6px; } }

.bars-labels { display:flex; justify-content:space-between; font-size:0.55rem; color:var(--neo-text-muted); font-weight:700; padding:0 2px; }
.bars-labels span { flex:1; text-align:center; }

.card-side-neo { background:var(--neo-surface); border-radius:24px; padding:18px; box-shadow:var(--neo-soft-raised); display:flex; flex-direction:column; min-width:0; }
.card-today { flex:1; }
.card-todo-full { flex:1; }
.side-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.side-icon-box { width:42px; height:42px; border-radius:12px; background:var(--neo-surface); box-shadow:var(--neo-soft-inset); display:flex; align-items:center; justify-content:center; color:var(--neo-text-heading); font-size:1.15rem; flex-shrink:0; }
.side-head-text { flex:1; display:flex; justify-content:space-between; align-items:center; }
.side-title { font-size:0.78rem; font-weight:700; color:var(--neo-text-sub); }
.side-value { font-size:1.4rem; font-weight:800; color:var(--neo-text-heading); }

/* Todo list */
.side-list-neo { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
.side-list-neo::-webkit-scrollbar { width:4px; }
.side-list-neo::-webkit-scrollbar-thumb { background:rgba(163,177,198,0.3); border-radius:10px; }
.todo-neo-item { background:var(--neo-surface); border-radius:14px; padding:11px 13px; box-shadow:var(--neo-soft-inset); cursor:pointer; transition:all 0.25s ease; display:flex; gap:10px; align-items:center; border-left:3px solid transparent; }
.todo-neo-item:hover { box-shadow:var(--neo-soft-raised); transform:translateY(-2px); }
.todo-neo-item.urgent { border-left-color:rgba(245,101,101,0.55); }
.todo-neo-body { flex:1; min-width:0; }
.todo-neo-title { font-size:0.8rem; font-weight:700; color:var(--neo-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.todo-neo-meta { font-size:0.68rem; color:var(--neo-text-sub); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.todo-neo-days { font-size:0.66rem; font-weight:700; color:var(--neo-text-sub); flex-shrink:0; white-space:nowrap; }
.todo-neo-item.urgent .todo-neo-days { color:#c53030; }

/* Medali tuntas */
.todo-empty-medal { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px 10px; }
.medal-well { width:92px; height:92px; border-radius:50%; background:var(--neo-surface); box-shadow:var(--neo-soft-inset); display:flex; align-items:center; justify-content:center; animation:medalBreath 2.6s ease-in-out infinite; }
@keyframes medalBreath { 0%,100% { box-shadow:var(--neo-soft-inset), 0 0 0 0 rgba(72,187,120,0.2); } 50% { box-shadow:var(--neo-soft-inset), 0 0 18px 4px rgba(72,187,120,0.3); } }
.medal-well svg { width:46px; height:46px; }
.medal-circle { fill:none; stroke:rgba(72,187,120,0.35); stroke-width:2; }
.medal-check { fill:none; stroke:#276749; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:48; stroke-dashoffset:48; animation:drawCheck 0.9s ease forwards 0.3s; }
@keyframes drawCheck { to { stroke-dashoffset:0; } }
.medal-title { font-size:0.85rem; font-weight:800; color:var(--neo-text-heading); }
.medal-sub { font-size:0.7rem; color:var(--neo-text-sub); text-align:center; }

/* Carousel: slide = GRID 2 KOLOM (ke samping) */
.carousel-vert-wrap { flex:1; position:relative; overflow:hidden; display:flex; flex-direction:column; min-height:180px; }
.carousel-vert-track { flex:1; position:relative; min-height:180px; }
.carousel-vert-slide { position:absolute; inset:0; opacity:0; transform:translateY(12px); transition:opacity 0.5s ease, transform 0.5s ease; pointer-events:none; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.carousel-vert-slide.active { opacity:1; transform:translateY(0); pointer-events:auto; }

.cv-single { grid-column:1 / -1; background:var(--neo-surface); border-radius:14px; padding:14px; box-shadow:var(--neo-soft-inset); display:flex; flex-direction:column; justify-content:center; gap:5px; cursor:pointer; overflow:hidden; }
.cv-time { font-size:0.72rem; font-weight:800; color:var(--neo-text-heading); }
.cv-title { font-size:0.85rem; font-weight:800; color:var(--neo-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cv-title.cv-batal { text-decoration:line-through; color:#c53030; }
.cv-pemohon { font-size:0.7rem; color:var(--neo-text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cv-desc { font-size:0.68rem; color:var(--neo-text-muted); line-height:1.35; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
.cv-single .cv-desc { -webkit-line-clamp:3; }
.cv-foot { display:flex; justify-content:space-between; align-items:center; margin-top:5px; gap:8px; }
.cv-place { font-size:0.68rem; color:var(--neo-text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }

.cv-mini { height:100%; background:var(--neo-surface); border-radius:12px; padding:10px 12px; box-shadow:var(--neo-soft-inset); display:flex; flex-direction:column; justify-content:center; gap:4px; cursor:pointer; overflow:hidden; transition:all 0.25s ease; }
.cv-mini:hover { box-shadow:var(--neo-soft-raised); }
.cv-mini .cv-desc { -webkit-line-clamp:2; }
.cv-mini .cv-foot { margin-top:2px; }
.cv-mini-wide { grid-column:1 / -1; }

.cv-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--neo-text-muted); font-size:0.78rem; font-weight:600; text-align:center; padding:20px; }
.cv-empty i { font-size:1.6rem; opacity:0.5; }
.carousel-vert-dots { display:flex; justify-content:center; gap:5px; margin-top:10px; }
.cv-dot { width:6px; height:6px; border-radius:50%; background:rgba(163,177,198,0.5); cursor:pointer; transition:all 0.3s; }
.cv-dot.active { width:16px; border-radius:8px; background:var(--neo-accent); }

/* Chips */
.chip-soft { font-size:0.62rem; font-weight:700; padding:3px 9px; border-radius:99px; box-shadow:var(--neo-soft-inset); white-space:nowrap; }
.chip-active { background:rgba(72,187,120,0.14); color:#276749; }
.chip-urgent { background:rgba(245,101,101,0.14); color:#c53030; }
.chip-muted { background:rgba(163,177,198,0.18); color:var(--neo-text-sub); }
.chip-accent { background:rgba(102,126,234,0.14); color:#4c51bf; }
.chip-batal { background:rgba(245,101,101,0.14); color:#c53030; }

.dash-bottom-row { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.card-bottom-neo { background:var(--neo-surface); border-radius:22px; padding:18px; box-shadow:var(--neo-soft-raised); display:flex; align-items:center; gap:14px; }
.bottom-icon { width:48px; height:48px; border-radius:14px; background:var(--neo-surface); box-shadow:var(--neo-soft-inset); display:flex; align-items:center; justify-content:center; color:var(--neo-text-heading); font-size:1.3rem; flex-shrink:0; }
.bottom-info { flex:1; }
.bottom-title { font-size:0.82rem; font-weight:800; color:var(--neo-text-heading); }
.bottom-sub { font-size:0.68rem; color:var(--neo-text-sub); }
.bottom-val { font-size:1.4rem; font-weight:800; color:var(--neo-text-heading); }

.dash-latest-section { background:var(--neo-surface); border-radius:24px; padding:20px; box-shadow:var(--neo-soft-raised); }
.latest-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.latest-title { font-size:0.9rem; font-weight:800; color:var(--neo-text-heading); display:flex; align-items:center; gap:8px; }
.latest-title i { color:var(--neo-text-sub); }
.latest-link { font-size:0.78rem; font-weight:700; color:var(--neo-text-sub); text-decoration:none; transition:color 0.2s; }
.latest-link:hover { color:var(--neo-text-heading); }
.latest-list-neo { display:flex; flex-direction:column; gap:10px; }
.latest-neo-item { background:var(--neo-surface); border-radius:16px; padding:14px 16px; box-shadow:var(--neo-soft-flat); display:flex; align-items:center; gap:14px; cursor:pointer; transition:all 0.25s ease; }
.latest-neo-item:hover { box-shadow:var(--neo-soft-raised); transform:translateX(4px); }
.latest-pill { background:var(--neo-surface); box-shadow:var(--neo-soft-inset); color:var(--neo-text-heading); padding:6px 12px; border-radius:99px; font-weight:800; font-size:0.78rem; min-width:48px; text-align:center; flex-shrink:0; }
.latest-body { flex:1; min-width:0; }
.latest-item-title { font-size:0.88rem; font-weight:700; color:var(--neo-text-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.latest-item-title.batal { text-decoration:line-through; color:#c53030; }
.latest-item-meta { font-size:0.72rem; color:var(--neo-text-sub); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.latest-arrow { color:var(--neo-text-muted); flex-shrink:0; transition:transform 0.2s; }
.latest-neo-item:hover .latest-arrow { transform:translateX(4px); color:var(--neo-text-heading); }

.agenda-item-batal { opacity:0.75; }
.agenda-item-batal .agenda-widget-title { color:#c53030 !important; text-decoration:line-through; }
.agenda-batal-badge { color:#c53030 !important; font-size:0.62rem !important; font-weight:700 !important; margin-left:5px; }

@media (max-width:1024px) {
  .dash-grid-v2 { grid-template-columns:1fr; }
  .dash-bottom-row { grid-template-columns:1fr; }
}
</style>
