<style>
/* =========================================================
   EKSPEDISI: FIXED HEADER + ROW + STEPPER + SINGLE SCROLL
   ========================================================= */
.page-content-scroll:has(#page-disposisi.active){ overflow:hidden !important; }
#page-disposisi{ height:100%; display:flex; flex-direction:column; }

.exp-list-wrap { flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:6px; }

/* Row */

.exp-stepper { display:flex; align-items:center; width:190px; flex-shrink:0; }
