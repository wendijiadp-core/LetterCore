<script>
/**
 * ============================================================================
 * LETTERCORE - RENDER ENGINE (DASHBOARD V2 FINAL)
 * ============================================================================
 */

var INDO_MONTHS = { januari:'01', februari:'02', maret:'03', april:'04', mei:'05', juni:'06',
                    juli:'07', agustus:'08', september:'09', oktober:'10', november:'11', desember:'12' };

function indoToYMD(str) {
  if (!str) return '';
  var s = String(str).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  if (s.indexOf(',') !== -1) s = s.split(',')[1];
  var m = s.trim().match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
  if (m) { var mm = INDO_MONTHS[m[2].toLowerCase()]; if (mm) return m[3] + '-' + mm + '-' + ('0'+m[1]).slice(-2); }
  return '';
}
function _todayYMD() { var n = new Date(); return n.getFullYear() + '-' + ('0'+(n.getMonth()+1)).slice(-2) + '-' + ('0'+n.getDate()).slice(-2); }
function _hm(v) { if (!v) return null; var m = String(v).match(/(\d{1,2})[.:](\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; }

var LIBUR_NASIONAL = {
  '2026-01-01':'Tahun Baru Masehi','2026-02-17':'Tahun Baru Imlek 2577','2026-03-19':'Hari Suci Nyepi',
  '2026-03-20':'Idul Fitri 1447 H','2026-03-21':'Idul Fitri 1447 H','2026-04-03':'Wafat Isa Almasih',
  '2026-05-01':'Hari Buruh Internasional','2026-05-14':'Kenaikan Isa Almasih','2026-05-27':'Idul Adha 1447 H',
  '2026-05-31':'Hari Raya Waisak','2026-06-01':'Hari Lahir Pancasila','2026-06-16':'Tahun Baru Islam 1448',
  '2026-08-17':'Hari Kemerdekaan RI','2026-08-25':'Maulid Nabi Muhammad SAW','2026-12-25':'Hari Raya Natal'
};

function getStatus(j, s) {
  var ymd = indoToYMD(j.tglMulai || j.tglKegiatan);
  var ymdEnd = indoToYMD(j.tglSelesai || j.tglMulai || j.tglKegiatan) || ymd;
  if (!ymd) return { code:'BELUM', label:'Tanpa Jadwal', chip:'chip-muted' };
  var today = _todayYMD();
  if (today < ymd) return { code:'AKAN', label:'Akan Datang', chip:'chip-accent' };
  if (today > ymdEnd) return { code:'SELESAI', label:'Selesai', chip:'chip-muted' };
  var start = _hm(j.waktuMulai), end = _hm(j.waktuSelesai);
  var now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  var hasLater = s && s.jadwalList && s.jadwalList.some(function(j2){ return indoToYMD(j2.tglSelesai||j2.tglMulai||j2.tglKegiatan) > today; });
  if (start !== null && nowMin < start) return { code:'BELUM_MULAI', label:'Belum Mulai', chip:'chip-accent' };
  if (end !== null && nowMin > end) {
    if (hasLater) return { code:'LANJUT', label:'Berlanjut', chip:'chip-urgent' };
    return { code:'SELESAI', label:'Selesai', chip:'chip-muted' };
  }
  if (start !== null) return { code:'BERLANGSUNG', label:'Berlangsung', chip:'chip-active' };
  return { code:'HARI_INI', label:'Hari Ini', chip:'chip-active' };
}

function esc(v){ return UIHelper.escapeHtml(v); }
function isBatal(s){ return s && s.status === 'BATAL'; }

function handleDashboardSearch() {
  var q = document.getElementById('dashSearchInput').value.toLowerCase().trim();
  if (!q) { renderDashboard(rawDataSurat); return; }
  var filtered = rawDataSurat.filter(function (s) {
    return (s.pengirim||'').toLowerCase().includes(q) || (s.perihal||'').toLowerCase().includes(q) ||
           (s.deskripsi||'').toLowerCase().includes(q) || (s.nomorSurat||'').toLowerCase().includes(q) ||
           (s.agendaNomor||'').toLowerCase().includes(q);
  });
  renderDashboard(filtered);
}

var _todaySlideIdx = 0, _todayTimer = null, _todaySlides = [];

function _renderTodayCarousel() {
  var track = document.getElementById('mcTodayCarousel');
  var dots = document.getElementById('mcTodayDots');
  if (!track) return;
  if (_todaySlides.length === 0) {
    track.innerHTML = '<div class="cv-empty">Tidak ada kegiatan hari ini</div>';
    if (dots) dots.innerHTML = '';
    return;
  }
  track.innerHTML = _todaySlides.map(function(o, i){
    var st = getStatus(o.j, o.s);
    var batal = isBatal(o.s);
    var desc = o.s.deskripsi ? '<div class="cv-desc">' + esc(o.s.deskripsi) + '</div>' : '';
    return '<div class="carousel-vert-slide' + (i===_todaySlideIdx?' active':'') + '" onclick="openModalDetailSurat(\'' + esc(o.s.idSurat) + '\')">' +
      '<div class="cv-time"><i class="bi bi-clock me-1"></i>' + esc(o.j.waktuMulai || '--:--') + (o.j.waktuSelesai ? ' - ' + esc(o.j.waktuSelesai) : '') + '</div>' +
      '<div class="cv-title' + (batal?' cv-batal':'') + '">' + esc(o.s.perihal) + '</div>' +
      '<div class="cv-pemohon"><i class="bi bi-building me-1"></i>' + esc(o.s.pengirim) + '</div>' +
      desc +
      '<div class="cv-foot"><span class="cv-place"><i class="bi bi-geo-alt me-1"></i>' + esc(o.j.tempatKegiatan || '-') + '</span>' +
      '<span class="chip-soft ' + (batal?'chip-batal':st.chip) + '">' + (batal?'Dibatalkan':st.label) + '</span></div>' +
    '</div>';
  }).join('');
  if (dots) {
    dots.innerHTML = _todaySlides.map(function(_, i){
      return '<div class="cv-dot' + (i===_todaySlideIdx?' active':'') + '" onclick="goTodaySlide(' + i + ')"></div>';
    }).join('');
  }
}
function goTodaySlide(i) { _todaySlideIdx = i; _renderTodayCarousel(); _resetTodayTimer(); }
function _resetTodayTimer() {
  if (_todayTimer) clearInterval(_todayTimer);
  if (_todaySlides.length > 1) {
    _todayTimer = setInterval(function(){ _todaySlideIdx = (_todaySlideIdx + 1) % _todaySlides.length; _renderTodayCarousel(); }, 3500);
  }
}

function renderDashboard(data) {
  data = data || [];
  var el = function(id){ return document.getElementById(id); };
  if (el('dashLoading')) el('dashLoading').style.display = 'none';

  var totalJadwal = 0, scanCount = 0, tempatSet = {};
  var aktifCount = 0, selesaiCount = 0;
  data.forEach(function(s){
    if (s.urlScan) scanCount++;
    if (!isBatal(s)) {
      aktifCount++;
      var em = ekspedisiMap[s.idSurat] || {};
      if (em.tahap === 'diterima' || em.tahap === 'selesai_tanpa_balasan') selesaiCount++;
      if (s.jadwalList) { totalJadwal += s.jadwalList.length; s.jadwalList.forEach(function(j){ if(j.tempatKegiatan) tempatSet[j.tempatKegiatan]=1; }); }
    }
  });
  var ringPct = aktifCount ? Math.round((selesaiCount / aktifCount) * 100) : 0;

  if (el('mcRingPct')) el('mcRingPct').innerText = ringPct + '%';
  var arc = document.getElementById('mcRingArc');
  if (arc) { var circ = 2 * Math.PI * 52; setTimeout(function(){ arc.setAttribute('stroke-dasharray', ((ringPct/100)*circ) + ' ' + circ); }, 100); }

  var bars = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var ymd = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
    var count = 0;
    data.forEach(function(s){ (s.jadwalList||[]).forEach(function(j){ if (indoToYMD(j.tglMulai||j.tglKegiatan) === ymd) count++; }); });
    bars.push(count);
  }
  var maxBar = Math.max(1, Math.max.apply(null, bars));
  if (el('mcBars')) {
    el('mcBars').innerHTML = bars.map(function(c){
      return '<div class="mc-bar"><div class="mc-bar-fill" style="height:' + Math.max(8,(c/maxBar)*100) + '%;"></div></div>';
    }).join('');
  }

  if (el('mcUserAvatar')) el('mcUserAvatar').innerText = (currentUser && currentUser.fullName ? currentUser.fullName : 'U').charAt(0).toUpperCase();
  if (el('dashTotalSurat')) el('dashTotalSurat').innerText = data.length;
  if (el('dashTotalJadwal')) el('dashTotalJadwal').innerText = totalJadwal;
  if (el('dashTotalTempat')) el('dashTotalTempat').innerText = Object.keys(tempatSet).length;

  var today = _todayYMD();
  _todaySlides = [];
  data.forEach(function(s){
    (s.jadwalList||[]).forEach(function(j){
      var y = indoToYMD(j.tglMulai||j.tglKegiatan), ye = indoToYMD(j.tglSelesai||j.tglMulai||j.tglKegiatan)||y;
      if (y && today >= y && today <= ye) _todaySlides.push({s:s, j:j});
    });
  });
  if (el('mcTodayCount')) el('mcTodayCount').innerText = _todaySlides.length;
  _todaySlideIdx = 0;
  _renderTodayCarousel();
  _resetTodayTimer();

  var todoItems = [];
  data.forEach(function(s){
    if (isBatal(s)) return;
    var em = ekspedisiMap[s.idSurat] || {};
    var stage = em.tahap || 'diinput';
    if (stage === 'diterima' || stage === 'selesai_tanpa_balasan') return;
    var riwayat = em.riwayat || [];
    var last = riwayat.length ? riwayat[riwayat.length-1] : null;
    var days = 0;
    if (last && last.timestamp) { var t = new Date(last.timestamp); if (!isNaN(t.getTime())) days = Math.max(0, Math.floor((Date.now()-t.getTime())/86400000)); }
    var needReply = !!riwayat.filter(function(r){ return r.tahap==='keputusan' && r.perluBalasan; })[0];
    var replyMade = !!riwayat.filter(function(r){ return r.tahap==='balasan'; })[0];
    todoItems.push({ s:s, days:days, urgent: needReply && !replyMade });
  });
  todoItems.sort(function(a,b){ return (b.urgent-a.urgent) || (b.days-a.days); });
  if (el('mcTodoCount')) el('mcTodoCount').innerText = todoItems.length;
  if (el('mcTodoListMini')) {
    if (todoItems.length === 0) {
      el('mcTodoListMini').innerHTML = '<div style="text-align:center;color:#276749;font-size:0.78rem;padding:20px;font-weight:700;">Semua tuntas ✔</div>';
    } else {
      el('mcTodoListMini').innerHTML = todoItems.slice(0,8).map(function(o){
        // title attribute memperjelas arti "2h" = mengendap 2 hari
        return '<div class="todo-neo-item' + (o.urgent?' urgent':'') + '" onclick="goFollowUp(\'' + esc(o.s.idSurat) + '\')" title="Mengendap ' + o.days + ' hari sejak aktivitas terakhir">' +
          '<div class="todo-neo-body"><div class="todo-neo-title">' + esc(o.s.perihal) + '</div>' +
          '<div class="todo-neo-meta"><i class="bi bi-building me-1"></i>' + esc(o.s.pengirim) + '</div></div>' +
          '<div class="todo-neo-days">⏳ ' + o.days + 'h</div></div>';
      }).join('');
    }
  }

  var latest = data.slice(0, 5);
  var latestEl = el('mcLatestList');
  if (latestEl) {
    if (latest.length === 0) {
      latestEl.innerHTML = '<div style="text-align:center;color:var(--neo-text-muted);font-size:0.82rem;padding:24px;">Belum ada surat masuk.</div>';
    } else {
      latestEl.innerHTML = latest.map(function(s){
        var batal = isBatal(s);
        var kat = kategoriList.find(function(k){ return k.id === s.kategoriId; });
        var chip = batal ? '<span class="chip-soft chip-batal">Dibatalkan</span>' : '<span class="chip-soft chip-active">Aktif</span>';
        return '<div class="latest-neo-item" onclick="openModalDetailSurat(\'' + esc(s.idSurat) + '\')">' +
          '<div class="latest-pill">' + esc(s.agendaNomor) + '</div>' +
          '<div class="latest-body"><div class="latest-item-title' + (batal?' batal':'') + '">' + esc(s.perihal) + '</div>' +
          '<div class="latest-item-meta"><i class="bi bi-building me-1"></i>' + esc(s.pengirim) + (kat?' · '+esc(kat.nama):'') + ' · ' + esc(s.tglDiterima) + '</div></div>' +
          '<div class="latest-chip">' + chip + '</div>' +
          '<div class="latest-arrow"><i class="bi bi-chevron-right"></i></div></div>';
      }).join('');
    }
  }
}

function goFollowUp(id) {
  if (typeof switchPage === 'function') switchPage('page-disposisi');
  setTimeout(function(){ if (typeof openEkspedisi === 'function') openEkspedisi(id); }, 250);
}

function renderSuratTable(data) {
  var tbody = document.getElementById('suratTableBody');
  if (!tbody) return;
  if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--neo-text-muted);">Tidak ada data surat.</td></tr>'; return; }
  tbody.innerHTML = data.map(function (s) {
    var batal = isBatal(s);
    var st = (s.jadwalList && s.jadwalList.length) ? getStatus(s.jadwalList[0], s) : { label:'-', chip:'chip-muted' };
    var kat = kategoriList.find(function(k){ return k.id === s.kategoriId; });
    var disp = s.urlDisposisi ? '<a class="dsc-btn-action" style="position:relative;" title="Buka Disposisi" target="_blank" href="' + esc(s.urlDisposisi) + '"><i class="bi bi-file-earmark-word"></i><span class="dot-status" style="background:#4a5568; box-shadow:0 0 6px rgba(0,0,0,.2);"></span></a>' : '<span class="dsc-btn-action" style="opacity:.35;"><i class="bi bi-file-earmark-word"></i></span>';
    var statusBtn = batal ? '<button class="dsc-btn-action" title="Aktifkan Kembali" onclick="aksiAktifkan(\'' + esc(s.idSurat) + '\')"><i class="bi bi-arrow-counterclockwise"></i></button>' : '<button class="dsc-btn-action" title="Batalkan Kegiatan" onclick="openDialogBatalkan(\'' + esc(s.idSurat) + '\')"><i class="bi bi-x-octagon"></i></button>';
    return '<tr' + (batal?' style="opacity:.6;"':'') + '>' +
      '<td><b>' + esc(s.agendaNomor) + '</b></td><td>' + esc(s.pengirim) + '</td>' +
      '<td style="text-align:left !important; padding-left:1rem !important;"><b>' + esc(s.perihal) + '</b><br><small style="color:var(--neo-text-sub);">' + esc(s.nomorSurat) + '</small></td>' +
      '<td>' + esc(kat?kat.nama:(s.kategoriId||'-')) + '</td><td>' + esc(s.tglDiterima) + '</td>' +
      '<td><span class="chip-soft ' + (batal?'chip-batal':st.chip) + '">' + (batal?'Dibatalkan':st.label) + '</span></td>' +
      '<td><div class="action-btn-group">' + disp +
      '<button class="dsc-btn-action" title="Detail" onclick="openModalDetailSurat(\'' + esc(s.idSurat) + '\')"><i class="bi bi-eye"></i></button>' +
      '<button class="dsc-btn-action" title="Edit" onclick="openModalEditSurat(\'' + esc(s.idSurat) + '\')"><i class="bi bi-pencil"></i></button>' +
      statusBtn + '<button class="dsc-btn-action" title="Hapus" onclick="konfirmasiHapusSurat(\'' + esc(s.idSurat) + '\')"><i class="bi bi-trash"></i></button></div></td></tr>';
  }).join('');
}

function renderSidebarAgenda() {
  var list = document.getElementById('sidebarAgendaList');
  if (!list) return;
  var now = new Date(), curMonth = now.getMonth(), curYear = now.getFullYear(), items = [];
  rawDataSurat.forEach(function(s){ (s.jadwalList||[]).forEach(function(j){ var ymd = indoToYMD(j.tglMulai||j.tglKegiatan); if (ymd) { var p = ymd.split('-'); if (parseInt(p[1],10)-1===curMonth && parseInt(p[0],10)===curYear) items.push({s:s,j:j,ymd:ymd}); } }); });
  items.sort(function(a,b){ return a.ymd < b.ymd ? -1 : 1; });
  if (items.length === 0) { list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--neo-text-muted); font-size:0.8rem;">Tidak ada agenda bulan ini.</div>'; return; }
  list.innerHTML = items.slice(0,10).map(function(o){
    var batal = isBatal(o.s);
    var badge = batal ? '<span class="agenda-batal-badge">(Batal)</span>' : '';
    return '<div class="agenda-widget-item' + (batal?' agenda-item-batal':'') + '" onclick="openModalDetailSurat(\'' + esc(o.s.idSurat) + '\')"><div class="agenda-widget-icon"><i class="bi bi-calendar-event"></i></div><div class="agenda-widget-body"><div class="agenda-widget-title">' + esc(o.s.pengirim) + badge + '</div><div class="agenda-widget-sub">' + esc(o.s.perihal) + '</div><div class="agenda-widget-meta"><span><i class="bi bi-clock"></i> ' + esc(o.j.tglMulai||o.j.tglKegiatan) + '</span></div></div></div>';
  }).join('');
}

function renderConventionalCalendar() {
  var grid = document.getElementById('calendarGridDays'), title = document.getElementById('calendarMonthYearTitle');
  if (!grid || !title) return;
  var q = ((document.getElementById('calendarSearchInput')||{}).value||'').toLowerCase();
  var y = currentCalendarDate.getFullYear(), m = currentCalendarDate.getMonth();
  var MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  title.innerText = MONTHS[m] + ' ' + y;
  var firstDay = new Date(y,m,1).getDay(), offset = (firstDay===0?6:firstDay-1);
  var daysInMonth = new Date(y,m+1,0).getDate(), daysPrev = new Date(y,m,0).getDate();
  var html = '';
  for (var i=offset; i>0; i--) html += '<div class="calendar-cell other-month"><div class="calendar-date-num">' + (daysPrev-i+1) + '</div></div>';
  var today = new Date();
  for (var d=1; d<=daysInMonth; d++) {
    var dateStr = y + '-' + ('0'+(m+1)).slice(-2) + '-' + ('0'+d).slice(-2), events = '';
    var lib = LIBUR_NASIONAL[dateStr];
    if (lib && (!q || lib.toLowerCase().indexOf(q)!==-1)) events += '<div class="calendar-event-chip calendar-event-holiday"><i class="bi bi-flag-fill me-1"></i>' + esc(lib) + '</div>';
    rawDataSurat.forEach(function(s){ (s.jadwalList||[]).forEach(function(j){ if (indoToYMD(j.tglMulai||j.tglKegiatan)===dateStr) { var label = s.perihal||'Kegiatan'; if (!q || label.toLowerCase().indexOf(q)!==-1 || (j.tempatKegiatan||'').toLowerCase().indexOf(q)!==-1) { var batal = isBatal(s); events += '<div class="calendar-event-chip' + (batal?' calendar-event-batal':'') + '" onclick="event.stopPropagation(); openModalDetailSurat(\'' + esc(s.idSurat) + '\')">' + esc(label) + (batal?' (Batal)':'') + '</div>'; } } }); });
    var isToday = (d===today.getDate() && m===today.getMonth() && y===today.getFullYear());
    html += '<div class="calendar-cell' + (isToday?' today':'') + '"><div class="calendar-date-num">' + d + '</div>' + (events?'<div class="cal-events">'+events+'</div>':'') + '</div>';
  }
  grid.innerHTML = html;
}

function renderDisposisiCards() {
  var box = document.getElementById('ekspedisiList'); if (!box) return;
  var q = ((document.getElementById('disposisiSearchInput')||{}).value||'').toLowerCase();
  var fStage = ((document.getElementById('filterTahap')||{}).value||'');
  var list = rawDataSurat.filter(function(s){ var st = (ekspedisiMap[s.idSurat]||{}).tahap||'diinput'; if (fStage && st!==fStage) return false; return (s.agendaNomor||'').toLowerCase().indexOf(q)!==-1 || (s.perihal||'').toLowerCase().indexOf(q)!==-1 || (s.pengirim||'').toLowerCase().indexOf(q)!==-1; });
  var badge = document.getElementById('disposisiCountBadge'); if (badge) badge.innerHTML = list.length + ' Surat';
  if (!list.length) { box.innerHTML = '<div style="text-align:center;padding:40px;color:var(--neo-text-muted);">Tidak ada surat.</div>'; return; }
  var html = '';
  for (var i=0; i<list.length; i++) {
    var s = list[i], st = (ekspedisiMap[s.idSurat]||{}).tahap||'diinput';
    var link = s.urlDisposisi ? '<a target="_blank" href="' + esc(s.urlDisposisi) + '" style="color:var(--neo-text-heading);text-decoration:none;font-weight:600;">Lembar disposisi</a>' : '<span style="color:var(--neo-text-muted);">-</span>';
    var stageBadge = isBatal(s) ? '<span class="chip-soft chip-batal">Dibatalkan</span>' : '<span class="chip-soft chip-accent">' + esc(TAHAP_LABEL[st]||st) + '</span>';
    html += '<div class="col-md-6" style="margin-bottom:15px;"><div class="disposisi-card' + (isBatal(s)?' disposisi-card-batal':'') + '" onclick="klikTimeline(\'' + esc(s.idSurat) + '\')" style="background:var(--neo-surface);border-radius:var(--neo-radius-lg);padding:20px;box-shadow:var(--neo-soft-raised);cursor:pointer;transition:all 0.2s;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div style="width:40px;height:40px;border-radius:10px;background:var(--neo-bg-base);display:flex;align-items:center;justify-content:center;color:var(--neo-text-heading);box-shadow:var(--neo-soft-inset);"><i class="bi bi-box-seam"></i></div>' + stageBadge + '</div>';
    html += '<div style="font-weight:800;color:var(--neo-text-heading);font-size:1rem;margin-bottom:5px;">' + esc(s.agendaNomor) + ' — ' + esc(s.perihal) + '</div>';
    html += '<div style="font-size:0.8rem;color:var(--neo-text-sub);margin-bottom:15px;"><i class="bi bi-building me-1"></i>' + esc(s.pengirim) + ' • ' + esc(s.tglDiterima) + '</div>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(163,177,198,0.2);padding-top:15px;"><span>' + link + '</span>';
    html += '<button type="button" style="background:var(--neo-surface);color:var(--neo-text-heading);border:none;padding:6px 15px;border-radius:20px;font-size:0.75rem;font-weight:700;cursor:pointer;box-shadow:var(--neo-soft-raised);" onclick="event.stopPropagation();klikTimeline(\'' + esc(s.idSurat) + '\')"><i class="bi bi-clock-history me-1"></i>Timeline</button></div></div></div>';
  }
  box.innerHTML = html;
}

function klikTimeline(id) { if (typeof openEkspedisi === 'function') openEkspedisi(id); }
</script>
