<!-- ============ MODAL MANAJEMEN KATEGORI ============ -->
<div class="modal fade" id="modalKategori" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-outer-card modal-mid">

        <button type="button" class="modal-close-btn" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        <h6 class="fw-bold mb-3" style="color:var(--neo-text-heading); font-size:1.05rem; padding-right:30px;">
          <i class="bi bi-tags-fill" style="color:var(--neo-accent);"></i> Manajemen Kategori & Field
        </h6>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div style="font-size:.72rem; font-weight:800; color:var(--neo-text-sub); text-transform:uppercase;">Pilih kategori untuk diedit</div>
          <button type="button" class="sm-btn-subtle" style="padding:6px 12px; font-size:.7rem;" onclick="newKategori()"><i class="bi bi-plus-lg"></i> Kategori Baru</button>

        </div>

            <div class="col-md-6"><label class="form-label">Nama Kategori</label><input type="text" id="katNama" class="form-control" placeholder="mis. Peminjaman Barang"></div>
            <div class="col-md-6"><label class="form-label">Tujuan Disposisi</label><input type="text" id="katTujuan" class="form-control" placeholder="mis. Wakil Dekan II"></div>
            <div class="col-md-6"><label class="form-label">Balasan Default</label><input type="text" id="katBalasan" class="form-control" placeholder="mis. Surat Jalan"></div>
            <div class="col-md-3"><label class="form-label">Label Tahap 2</label><input type="text" id="katLabel2" class="form-control" placeholder="Kegiatan"></div>
            <div class="col-md-3"><label class="form-label">Label Tahap 3</label><input type="text" id="katLabel3" class="form-control" placeholder="Detail"></div>
            <div class="col-md-6">
              <div class="switch-card"><input class="form-check-input" type="checkbox" id="katAktif" checked><label class="form-check-label" for="katAktif" style="font-size:.8rem; font-weight:700; margin:0;">Kategori aktif</label></div>
            </div>
            <div class="col-md-6">
              <div class="switch-card"><input class="form-check-input" type="checkbox" id="katPakaiJadwal" onchange="katJadwalChange()"><label class="form-check-label" for="katPakaiJadwal" style="font-size:.8rem; font-weight:700; margin:0;">Pakai jadwal kegiatan</label></div>
            </div>
          </div>
          <div id="katJadwalOpts" class="d-none" style="margin-top:10px;">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Sumber Tempat</label>
                <select id="katModeTempat" class="form-control" onchange="katModeTempatChange()">
                  <option value="INPUT">Input manual / picker</option>
                  <option value="FIELD">Ambil dari field</option>
                  <option value="NONE">Tanpa tempat</option>
                </select>
              </div>
              <div class="col-md-6" id="wrapKatModeField">
                <label class="form-label">Field Sumber Tempat</label>
                <select id="katModeField" class="form-control"><option value="">— pilih field —</option></select>
              </div>
            </div>
          </div>
          <div class="text-end mt-2">
            <button type="button" class="dsc-btn-primary" style="margin-bottom:0;" onclick="simpanKategoriSafe()"><i class="bi bi-save"></i> Simpan Kategori</button>

        </div>

              <label class="form-label">Tahap</label>
              <select id="fTahap" class="form-control">

                <option value="3">3 · Detail</option>
              </select>
            </div>
            <div class="col-md-5"><label class="form-label">Label Field</label><input type="text" id="fLabel" class="form-control" placeholder="mis. Nama Acara"></div>
            <div class="col-md-4">
              <label class="form-label">Tipe</label>
              <select id="fTipe" class="form-control" onchange="fTipeChange()">
                <option value="text">Teks</option>
                <option value="number">Angka</option>
                <option value="textarea">Textarea</option>
                <option value="select">Pilihan</option>
                <option value="repeater">Daftar (repeater)</option>
              </select>
            </div>
            <div class="col-md-6" id="wrapFOpsi">
              <label class="form-label" id="fOpsiLabel">Pilihan (pisahkan koma)</label>
              <input type="text" id="fOpsi" class="form-control" placeholder="mis. Roda dua,Roda empat">
            </div>
            <div class="col-md-6">
              <label class="form-label">Sumber Data</label>
              <select id="fSumber" class="form-control">
                <option value="">— bebas —</option>
                <option value="master_orang">Master Orang</option>
                <option value="master_aset:tempat">Master Tempat</option>
                <option value="master_aset:kendaraan">Master Kendaraan</option>
                <option value="master_aset:barang">Master Barang</option>
              </select>
            </div>
            <div class="col-md-6">
              <div class="switch-card"><input class="form-check-input" type="checkbox" id="fRequired"><label class="form-check-label" for="fRequired" style="font-size:.8rem; font-weight:700; margin:0;">Wajib diisi</label></div>
            </div>
            <div class="col-md-6">
              <div class="switch-card"><input class="form-check-input" type="checkbox" id="fOpsional"><label class="form-check-label" for="fOpsional" style="font-size:.8rem; font-weight:700; margin:0;">Opsional (toggle)</label></div>
            </div>
          </div>
          <div class="text-end mt-2">
            <button type="button" class="dsc-btn-primary" style="margin-bottom:0;" onclick="simpanFieldForm()"><i class="bi bi-plus-lg"></i> Tambah Field</button>
          </div>
          <div style="font-size:.72rem; font-weight:800; color:var(--neo-text-sub); text-transform:uppercase; margin:12px 0 8px;">Field terdaftar</div>
          <div class="sm-list-well">
            <div id="fieldListContainer"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
/* ===== Logika Kategori Baru ===== */
function newKategori() {
  window.__katDirty = false;
  if (typeof currentKatEdit !== 'undefined') currentKatEdit = '';
  var g = function(id){ return document.getElementById(id); };
  g('katId').value = '';
  g('katNama').value = '';
  g('katTujuan').value = '';
  g('katBalasan').value = '';
  g('katLabel2').value = '';
  g('katLabel3').value = '';
  g('katAktif').checked = true;
  g('katPakaiJadwal').checked = false;
  g('katModeTempat').value = 'INPUT';
  if (typeof katJadwalChange === 'function') katJadwalChange();
  g('fieldListContainer').innerHTML = '<div style="color:var(--neo-text-muted); font-size:.78rem; padding:8px;">Simpan kategori dulu, lalu tambahkan field di sini.</div>';
  g('katNama').focus();
  UIHelper.showToast('Mode kategori baru — isi lalu Simpan.', true);
}

function simpanKategoriSafe() {
  var g = function(id){ return document.getElementById(id); };
  var nama = g('katNama').value.trim();
  if (!nama) { UIHelper.showToast('Nama kategori wajib diisi.', false); g('katNama').focus(); return; }

  if (!g('katId').value) {
    var base = 'KAT-' + nama.toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);
    var id = base || ('KAT-' + Date.now());
    var n = 2;
    while (kategoriList.some(function(k){ return k.id === id; })) { id = base + '-' + n; n++; }
    g('katId').value = id;
  }
  var savedId = g('katId').value;

  simpanKategoriForm();

  setTimeout(function(){
    if (typeof currentKatEdit !== 'undefined') { currentKatEdit = savedId; }
    if (typeof renderFieldList === 'function') renderFieldList(savedId);
    if (typeof refreshKatFieldOptions === 'function') refreshKatFieldOptions('');
    if (typeof renderKategoriList === 'function') renderKategoriList();
  }, 700);
}
</script>
