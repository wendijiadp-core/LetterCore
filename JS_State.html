<script>
/**

 */

// ================= GLOBAL STATE =================
var rawDataSurat = [];
var rawDataSuratKeluar = [];
var jadwalListState = [];
var currentCalendarDate = new Date();
var flatpickrInstance = null;
var editingSuratMeta = { agendaNomor: '', createdAt: '' };
var carouselIntervalTimer = null;
var currentSlideIndex = 0;

// State untuk ruang SpaceCore
var daftarRuangSpaceCore = [];

// ================= DATE HELPERS =================
function formatTanggalIndo(dateString) {
  return UIHelper.formatDateIndo(dateString);
}

// ================= JADWAL STATUS =================
function getJadwalStatus(j, now) {
  now = now || new Date();
  if (!j) return { code: 'BELUM', label: 'Tanpa Jadwal', badgeClass: 'badge-status', isPulse: false };

  var tgl = j.tglMulai || j.tglKegiatan;
  if (!tgl) return { code: 'BELUM', label: 'Tanpa Jadwal', badgeClass: 'badge-status', isPulse: false };

  var parts = String(tgl).split('-');
  var eventDate = null;
  if (parts.length === 3) {
    eventDate = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }
  if (!eventDate || isNaN(eventDate.getTime())) {
    return { code: 'BELUM', label: '-', badgeClass: 'badge-status', isPulse: false };
  }

  var today = new Date(); today.setHours(0,0,0,0);
  eventDate.setHours(0,0,0,0);

  if (eventDate.getTime() === today.getTime()) {
    return { code: 'HARI_INI', label: 'Hari Ini', badgeClass: 'badge-status active', isPulse: true };
  }
  if (eventDate > today) {
    return { code: 'AKAN_DATANG', label: 'Akan Datang', badgeClass: 'badge-status', isPulse: false, accent: true };
  }
  return { code: 'SELESAI', label: 'Selesai', badgeClass: 'badge-status', isPulse: false, muted: true };
}

// ================= CALENDAR NAV =================
function prevMonth() {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
  renderConventionalCalendar();
}

function nextMonth() {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
  renderConventionalCalendar();
}

function goToToday() {
  currentCalendarDate = new Date();
  renderConventionalCalendar();
}

// ================= HELPER: tunggu fungsi tersedia sebelum di-wrap =================
window._whenReady = function(name, fn, maxAttempts) {
  maxAttempts = maxAttempts || 100;
  var attempts = 0;
  function check() {
    if (typeof window[name] === 'function') {
      try { fn(window[name]); } catch (e) { console.warn('[_whenReady] fn error for ' + name + ':', e); }
      return;
    }
    if (++attempts >= maxAttempts) {
      console.warn('[_whenReady] timeout waiting for: ' + name);
      return;
    }
    setTimeout(check, 100);
  }
  check();
};
</script>

<script>
/**
 * ============================================================================
 * LETTERCORE - API CALLS (Performance: paralel, cache, enum lokal)
 * FINAL: load ruang SpaceCore di loadAllData & refreshCoreData
 * ============================================================================
 */

/* ========== BOOT: core & master PARALEL ========== */
function loadAllData() {
  if (typeof neoProgress === 'function') neoProgress(true);

  UIHelper.callApi('apiLoadCore', [], function (core) {
    rawDataSurat = core.surat || [];
    kategoriList = core.kategori || [];
    ekspedisiMap = core.ekspedisi || {};
    if (typeof populateKategoriSelect === 'function') populateKategoriSelect();
    deriveEnumLists();
    refreshAllUI();
    if (typeof neoProgress === 'function') neoProgress(false);
  }, function (err) {
    console.error('[loadAllData] Gagal:', err);
    rawDataSurat = [];
    refreshAllUI();
    if (typeof neoProgress === 'function') neoProgress(false);
  }, true);

  UIHelper.callApi('apiGetDaftarSuratKeluar', [], function (d) {
    rawDataSuratKeluar = Array.isArray(d) ? d : [];
    if (typeof renderSuratKeluarList === 'function') {
      var pg = document.getElementById('page-surat-keluar');
      if (pg && pg.classList.contains('active')) renderSuratKeluarList();
    }
  }, function () { rawDataSuratKeluar = []; }, true);

  UIHelper.callApi('apiLoadMaster', [], function (m) {
    masterOrang = m.masterOrang || [];
    masterAset = {};
    (m.masterAset || []).forEach(function (a) { var j = a['jenis'] || 'lain'; if (!masterAset[j]) masterAset[j] = []; masterAset[j].push(a); });
  }, function () {}, true);

  // Load ruang SpaceCore
  UIHelper.callApi('apiGetDaftarRuangSpaceCore', [], function (d) {
    daftarRuangSpaceCore = Array.isArray(d) ? d : [];
    console.log('[SpaceCore] Ruangan dimuat:', daftarRuangSpaceCore.length);
  }, function () { daftarRuangSpaceCore = []; }, true);
}

/* ========== REFRESH CORE ========== */
function refreshCoreData() {
  if (typeof neoProgress === 'function') neoProgress(true);
  UIHelper.callApi('apiLoadCore', [], function (core) {
    rawDataSurat = core.surat || [];
    kategoriList = core.kategori || [];
    ekspedisiMap = core.ekspedisi || {};
    if (typeof populateKategoriSelect === 'function') populateKategoriSelect();
    deriveEnumLists();
    refreshAllUI();
    if (typeof neoProgress === 'function') neoProgress(false);
  }, function (err) {
    console.error('[refreshCoreData] Gagal:', err);
    if (typeof neoProgress === 'function') neoProgress(false);
  }, true);

  UIHelper.callApi('apiGetDaftarSuratKeluar', [], function (d) {
    rawDataSuratKeluar = Array.isArray(d) ? d : [];
    if (typeof renderSuratKeluarList === 'function') {
      var pg = document.getElementById('page-surat-keluar');
      if (pg && pg.classList.contains('active')) renderSuratKeluarList();
    }
  }, function () {}, true);

  // Refresh ruang SpaceCore
  UIHelper.callApi('apiGetDaftarRuangSpaceCore', [], function (d) {
    daftarRuangSpaceCore = Array.isArray(d) ? d : [];
  }, function () {}, true);
}

/* ========== REFRESH MASTER ========== */
function refreshMasterData() {
  UIHelper.callApi('apiGetKategoriList', [], function (d) {
    kategoriList = d || [];
    if (typeof populateKategoriSelect === 'function') populateKategoriSelect();
  }, function () {}, true);
}

/* ========== ENUM LOKAL ========== */
function deriveEnumLists() {
  var uniq = function (key) {
    var s = {};
    rawDataSurat.forEach(function (o) { if (o[key]) s[o[key]] = 1; });
    return Object.keys(s);
  };
  var tempat = {};
  rawDataSurat.forEach(function (s) {
    (s.jadwalList || []).forEach(function (j) { if (j.tempatKegiatan) tempat[j.tempatKegiatan] = 1; });
  });
  populateDatalist('listPengirim', uniq('pengirim'));
  populateDatalist('listTujuan', uniq('tujuan'));
  populateDatalist('listPerihal', uniq('perihal'));
  populateDatalist('listTempatKegiatan', Object.keys(tempat));
  populateDatalist('listPic', uniq('pic'));
  populateDatalist('listKontak', uniq('kontak'));
}

function populateDatalist(id, items) {
  var el = document.getElementById(id);
  if (!el || !items) return;
  el.innerHTML = '';
  items.forEach(function (item) {
    if (item) {
      var opt = document.createElement('option');
      opt.value = item;
      el.appendChild(opt);
    }
  });
}

function refreshAllUI() {
  if (typeof renderDashboard === 'function') renderDashboard(rawDataSurat);
  if (typeof renderSuratTable === 'function') renderSuratTable(rawDataSurat);
  if (typeof renderSidebarAgenda === 'function') renderSidebarAgenda();
  if (typeof renderSuratKeluarList === 'function') {
    var sk = document.getElementById('page-surat-keluar');
    if (sk && sk.classList.contains('active')) renderSuratKeluarList();
  }
  var kal = document.getElementById('page-kalendar');
  if (kal && kal.classList.contains('active') && typeof renderConventionalCalendar === 'function') {
    renderConventionalCalendar();
  }
  var disp = document.getElementById('page-disposisi');
  if (disp && disp.classList.contains('active') && typeof renderDisposisiCards === 'function') {
    renderDisposisiCards();
  }
}
</script>

<script>
/* ============ ARSIP SEGAR: PATCHED dengan _whenReady ============ */
(function(){
  if (window.__skFreshWired) return;
  window.__skFreshWired = true;

  function skReload(cb){
    try {
      UIHelper.callApi('apiGetDaftarSuratKeluar', [], function(d){
        rawDataSuratKeluar = Array.isArray(d) ? d : [];
        if (typeof renderSuratKeluarList === 'function') renderSuratKeluarList();
        if (cb) cb();
      }, function(){ if (cb) cb(); });
    } catch(e){ if (cb) cb(); }
  }
  window.skReload = skReload;

  window._whenReady('switchPage', function(origSwitch){
    window.switchPage = function(id){
      try { origSwitch.apply(this, arguments); } catch(e){ console.warn('[switchPage wrapper]', e); }
      if (id === 'page-surat-keluar') skReload();
    };
  });

  window._whenReady('submitSuratKeluar', function(origSubmit){
    window.submitSuratKeluar = function(){
      var r;
      try { r = origSubmit.apply(this, arguments); } catch(e){ console.warn('[submitSuratKeluar wrapper]', e); }
      setTimeout(function(){ skReload(); }, 900);
      return r;
    };
  });
})();
</script>
