<style>
/* ============ NEOSELECT ============ */
.neosel{position:relative;}
.neosel-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--neo-surface);border:none;border-radius:12px;padding:10px 14px;font-weight:700;font-size:.8rem;color:var(--neo-text-heading);box-shadow:var(--neo-soft-flat);cursor:pointer;transition:all .2s;font-family:inherit;}
.neosel-btn:hover{box-shadow:var(--neo-soft-raised);}
.neosel.open .neosel-btn{box-shadow:var(--neo-soft-inset);}
.neosel-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--neo-surface);border-radius:14px;box-shadow:var(--neo-soft-raised-lg);padding:8px;z-index:1060;max-height:230px;overflow-y:auto;}
.neosel-item{border-radius:10px;padding:8px 12px;font-size:.78rem;font-weight:700;color:var(--neo-text-sub);cursor:pointer;box-shadow:var(--neo-soft-flat);margin-bottom:6px;transition:all .15s;background:var(--neo-surface);}
.neosel-item:last-child{margin-bottom:0;}
.neosel-item:hover{transform:translateY(-1px);box-shadow:var(--neo-soft-raised);color:var(--neo-text-heading);}
.neosel-item.active{box-shadow:var(--neo-soft-inset);color:var(--neo-accent);}
.neosel-sm .neosel-btn{padding:7px 10px;font-size:.72rem;border-radius:10px;}
.jk-row{display:grid;grid-template-columns:1.4fr .9fr 1.4fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(163,177,198,.15);}
.sk-dyn-title{font-size:.7rem;font-weight:800;color:var(--neo-accent);text-transform:uppercase;margin:14px 0 8px;letter-spacing:.5px;}
.sk-info-box{background:rgba(102,126,234,.06);border:1px solid rgba(102,126,234,.25);border-radius:12px;padding:10px 12px;font-size:.72rem;color:var(--neo-text-sub);font-weight:600;}

/* ===== HUB PENGATURAN: kartu kelompok ===== */
.sk-hub-group{font-size:.68rem;font-weight:800;color:var(--neo-text-sub);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
.sk-hub-group:first-child{margin-top:0;}
.sk-hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sk-hub-card{display:flex;align-items:center;gap:12px;text-align:left;background:var(--neo-surface);border:none;border-radius:14px;padding:12px 14px;box-shadow:var(--neo-soft-flat);cursor:pointer;transition:all .2s;font-family:inherit;}
.sk-hub-card:hover{box-shadow:var(--neo-soft-raised);transform:translateY(-1px);}
.sk-hub-card.sk-hub-wide{grid-column:1 / -1;}
.sk-hub-ico{width:38px;height:38px;border-radius:12px;background:var(--neo-surface);box-shadow:var(--neo-soft-inset);display:flex;align-items:center;justify-content:center;color:var(--neo-accent);font-size:1.05rem;flex-shrink:0;}
.sk-hub-title{font-size:.8rem;font-weight:800;color:var(--neo-text-heading);}
.sk-hub-desc{font-size:.68rem;font-weight:600;color:var(--neo-text-sub);margin-top:2px;}

/* ===== MODAL NEO ===== */
.neo-dialog{
  position:fixed; inset:0; z-index:9998;
  display:flex; align-items:center; justify-content:center;
  padding:24px 16px;
  background:rgba(233,236,242,0.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  overflow-y:auto;
}
.neo-dialog-card.sk-wide{width:920px;max-width:94vw;}
.neo-dialog-card.sk-mid{width:760px;max-width:94vw;}
.neo-dialog .neo-modal-body{
  scrollbar-width:thin;
  scrollbar-color:rgba(102,126,234,0.55) transparent;
}
.neo-dialog .neo-modal-body::-webkit-scrollbar{ width:9px; }
.neo-dialog .neo-modal-body::-webkit-scrollbar-track{ background:rgba(163,177,198,0.18); border-radius:10px; }
.neo-dialog .neo-modal-body::-webkit-scrollbar-thumb{ background:rgba(102,126,234,0.55); border-radius:10px; border:2px solid transparent; background-clip:content-box; }
.neo-dialog .neo-swal-popup.neo-dialog-card::after{
  content:''; position:absolute; left:14px; right:14px; bottom:66px; height:30px;
  background:linear-gradient(to top, rgba(226,230,238,0.98), rgba(226,230,238,0));
  border-radius:0 0 16px 16px; pointer-events:none; opacity:0; transition:opacity .2s ease; z-index:5;
}
.neo-dialog .neo-swal-popup.neo-dialog-card.sk-can-scroll::after{ opacity:1; }
.neo-scroll-hint{
  position:absolute; left:50%; transform:translateX(-50%); bottom:70px;
  display:none; align-items:center; gap:5px; width:max-content;
  font-size:0.66rem; font-weight:800; color:var(--neo-accent);
  background:var(--neo-surface); box-shadow:var(--neo-soft-raised);
  padding:4px 13px; border-radius:99px; z-index:7; pointer-events:none; letter-spacing:.3px;
}
.neo-dialog .neo-swal-popup.sk-show-hint > .neo-scroll-hint{ display:inline-flex; }
.neo-scroll-hint i{ animation:neoBob 1.3s ease-in-out infinite; }
@keyframes neoBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }
</style>

<script>
/* =====================================================================
   SURAT KELUAR UI — VERSI TUNGGAL (ganti total, tanpa duplikat)
   ===================================================================== */
var _neoSelCb = {};
var _escSK = function(v){ return UIHelper.escapeHtml(v); };

/* ================= CACHE JENIS (buka instan) ================= */
var _skJenisCache = null;
function _skPreloadJenis(){
  try {
    UIHelper.callApi('apiGetDaftarJenisKeluar', [], function(d){ _skJenisCache = Array.isArray(d)?d:[]; }, function(){ _skJenisCache = _skJenisCache || []; });
  } catch(e){}
}
_skPreloadJenis();

/* ================= CACHE GLOBAL ================= */
var _lcCache = {};
function _lcPrime(key, api){
  UIHelper.callApi(api, [], function(d){ _lcCache[key] = d || []; }, function(){}, true);
}
function _lcWarmAll(){
  _lcPrime('tplKeluar', 'apiGetDaftarTemplateKeluar');
  _lcPrime('placeholder', 'apiGetDaftarPlaceholder');
  _lcPrime('fieldKeys', 'apiGetAvailableFieldKeys');
  _lcPrime('tplDisp', 'apiGetTemplateDisposisiList');
  _lcPrime('transform', 'apiGetDaftarTransformasiPH');
}
setTimeout(_lcWarmAll, 400);
function _lcGet(key, api, cb){
  if (_lcCache[key]) { cb(_lcCache[key]); return; }
  UIHelper.callApi(api, [], function(d){ _lcCache[key] = d || []; cb(_lcCache[key]); }, function(){ cb([]); }, true);
}
function _lcInvalidate(){ _lcCache = {}; setTimeout(_lcWarmAll, 300); }

/* ================= DIALOG MANAGER ================= */
var _skDialogs = {};

function _skBuildDialog(html, zIndex){
  var ov = document.createElement('div');
  ov.className = 'neo-dialog';
  ov.style.zIndex = zIndex || 9998;
  ov.innerHTML = html;

  var card = ov.querySelector('.neo-swal-popup') || ov.firstElementChild;
  if (card) {
    var inner = card.querySelector('.neo-swal-inner');
    if (inner && !inner.classList.contains('neo-modal-body')) inner.classList.add('neo-modal-body');
    var actions = card.querySelector('.neo-dialog-actions');

    card.style.setProperty('position','relative','important');
    card.style.setProperty('display','flex','important');
    card.style.setProperty('flex-direction','column','important');
    card.style.setProperty('max-height','92vh','important');
    card.style.setProperty('overflow','hidden','important');
    if (inner) {
      inner.style.setProperty('flex','1 1 auto','important');
      inner.style.setProperty('min-height','0','important');
      inner.style.setProperty('overflow-y','auto','important');
      inner.style.setProperty('padding-bottom','30px','important');
    }
    if (actions) actions.style.setProperty('flex','0 0 auto','important');

    if (!card.querySelector('.neo-scroll-hint')) {
      var hint = document.createElement('div');
      hint.className = 'neo-scroll-hint';
      hint.innerHTML = '<i class="bi bi-chevron-down"></i> scroll';
      card.appendChild(hint);
    }
    _skWireScrollHint(card, ov);
  }
  return ov;
}

function _skWireScrollHint(card, ov){
  if (!card || card.__skHintWired) return;
  card.__skHintWired = true;
  var body = card.querySelector('.neo-modal-body');
  var scroller = function(){
    if (body && body.scrollHeight - body.clientHeight > 4) return body;
    if (ov && ov.scrollHeight - ov.clientHeight > 4) return ov;
    return null;
  };
  var update = function(){
    var sc = scroller();
    var show = !!sc && (sc.scrollTop + sc.clientHeight < sc.scrollHeight - 6);
    card.classList.toggle('sk-show-hint', show);
    card.classList.toggle('sk-can-scroll', !!sc);
  };
  if (body) body.addEventListener('scroll', update, { passive:true });
  if (ov) ov.addEventListener('scroll', update, { passive:true });
  try { var mo = new MutationObserver(update); mo.observe(card, { childList:true, subtree:true }); } catch(e){}
  setTimeout(update, 80); setTimeout(update, 400); setTimeout(update, 900);
  window.addEventListener('resize', update);
}

function _skOpenDialog(key, html, zIndex){
  _skCloseDialog(key);
  var ov = _skBuildDialog(html, zIndex);
  document.body.appendChild(ov);
  _skDialogs[key] = ov;
  return ov;
}
function _skCloseDialog(key){ if (_skDialogs[key] && _skDialogs[key].parentNode) _skDialogs[key].parentNode.removeChild(_skDialogs[key]); delete _skDialogs[key]; }
function skClose(key){ _skCloseDialog(key); }

/* ================= NEOSELECT ================= */
function neoSelectHtml(id, options, value, placeholder) {
  var sel=null; for (var i=0;i<options.length;i++) if (String(options[i].value)===String(value)) sel=options[i];
  var label = sel ? sel.label : (placeholder||'— pilih —');
  return '<div class="neosel" id="'+id+'" data-value="'+_escSK(value||'')+'">' +
    '<button type="button" class="neosel-btn" onclick="neoSelToggle(\''+id+'\')"><span class="neosel-label" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+_escSK(label)+'</span><i class="bi bi-chevron-down"></i></button>' +
    '<div class="neosel-panel d-none">' + options.map(function(o){
      return '<div class="neosel-item'+(String(o.value)===String(value)?' active':'')+'" data-value="'+_escSK(o.value)+'" data-label="'+_escSK(o.label)+'" onclick="neoSelChoose(\''+id+'\', this)">'+_escSK(o.label)+'</div>';
    }).join('') + '</div></div>';
}
function neoSelToggle(id){ var w=document.getElementById(id); if(!w)return; var p=w.querySelector('.neosel-panel'); var was=!p.classList.contains('d-none'); closeAllNeoSel(); if(!was){p.classList.remove('d-none');w.classList.add('open');} }
function neoSelChoose(id,item){ var w=document.getElementById(id); if(!w)return; w.setAttribute('data-value',item.getAttribute('data-value')); w.querySelector('.neosel-label').textContent=item.getAttribute('data-label'); var it=w.querySelectorAll('.neosel-item'); for(var i=0;i<it.length;i++) it[i].classList.toggle('active',it[i]===item); closeAllNeoSel(); if(typeof _neoSelCb[id]==='function') _neoSelCb[id](item.getAttribute('data-value'),item.getAttribute('data-label')); }
function neoSelValue(id){ var w=document.getElementById(id); return w?(w.getAttribute('data-value')||''):''; }
function closeAllNeoSel(){ var o=document.querySelectorAll('.neosel.open'); for(var i=0;i<o.length;i++){o[i].classList.remove('open');o[i].querySelector('.neosel-panel').classList.add('d-none');} }
document.addEventListener('click', function(e){ if(!e.target.closest('.neosel')) closeAllNeoSel(); });

/* ================= HUB PENGATURAN (kartu kelompok) ================= */
function openPengaturan(){
  _skOpenDialog('skHub', '<div class="neo-swal-popup neo-dialog-card sk-mid">' +
    '<div class="neo-swal-inner" style="align-items:stretch;">' +
      '<div class="neo-swal-icon" style="color:var(--neo-accent);"><i class="bi bi-gear-fill"></i></div>' +
      '<div class="neo-swal-title">Pengaturan Surat</div>' +
      '<div class="neo-swal-text" style="font-size:0.72rem; margin-bottom:4px;">Pusat administrasi persuratan.</div>' +

      '<div class="sk-hub-group">Surat Masuk</div>' +
      '<div class="sk-hub-grid">' +
        '<button type="button" class="sk-hub-card" onclick="skClose(\'skHub\'); openManajemenKategori();">' +
          '<div class="sk-hub-ico"><i class="bi bi-tags"></i></div>' +
          '<div class="sk-hub-txt"><div class="sk-hub-title">Kategori & Field</div><div class="sk-hub-desc">Jenis surat masuk & isian form</div></div>' +
        '</button>' +
        '<button type="button" class="sk-hub-card" onclick="skClose(\'skHub\'); openModalKelolaTemplateDisposisi();">' +
          '<div class="sk-hub-ico"><i class="bi bi-file-earmark-word"></i></div>' +
          '<div class="sk-hub-txt"><div class="sk-hub-title">Template Disposisi</div><div class="sk-hub-desc">Doc disposisi per kategori</div></div>' +
        '</button>' +
      '</div>' +

      '<div class="sk-hub-group">Surat Keluar</div>' +
      '<div class="sk-hub-grid">' +
        '<button type="button" class="sk-hub-card sk-hub-wide" onclick="skClose(\'skHub\'); openModalKelolaTemplate();">' +
          '<div class="sk-hub-ico"><i class="bi bi-collection"></i></div>' +
          '<div class="sk-hub-txt"><div class="sk-hub-title">Jenis & Template</div><div class="sk-hub-desc">Mode Generate/Catat & template dokumen</div></div>' +
        '</button>' +
      '</div>' +

      '<div class="sk-hub-group">Mesin Dokumen</div>' +
      '<div class="sk-hub-grid">' +
        '<button type="button" class="sk-hub-card" onclick="skClose(\'skHub\'); openModalKelolaPlaceholder();">' +
          '<div class="sk-hub-ico"><i class="bi bi-braces"></i></div>' +
          '<div class="sk-hub-txt"><div class="sk-hub-title">Placeholder</div><div class="sk-hub-desc">Pemetaan {{KEY}} ke sumber data</div></div>' +
        '</button>' +
        '<button type="button" class="sk-hub-card" onclick="skClose(\'skHub\'); openModalKelolaTransformasiPH();">' +
          '<div class="sk-hub-ico"><i class="bi bi-braces-asterisk"></i></div>' +
          '<div class="sk-hub-txt"><div class="sk-hub-title">Transformasi</div><div class="sk-hub-desc">Ganti teks & format tanggal</div></div>' +
        '</button>' +
      '</div>' +

    '</div>' +
    '<div class="neo-dialog-actions"><button type="button" class="neo-btn-cancel" onclick="skClose(\'skHub\')">Tutup</button></div></div>', 9999);
}

/* ================= ENTRY POINT ================= */
function _todayYMD(){ var n=new Date(); return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2); }

function openModalSuratKeluar(asal, idSuratInduk) {
  var suratInduk=null;
  if (asal==='BALASAN' && idSuratInduk) suratInduk = rawDataSurat.find(function(s){ return s.idSurat===idSuratInduk; });
  if (_skJenisCache && _skJenisCache.length) {
    _renderModalSuratKeluar(asal, suratInduk, _skJenisCache, idSuratInduk);
    return;
  }
  Loader.show('Memuat form surat keluar...');
  UIHelper.callApi('apiGetDaftarJenisKeluar', [], function(jenisList){
    Loader.hide();
    _skJenisCache = Array.isArray(jenisList)?jenisList:[];
    _renderModalSuratKeluar(asal, suratInduk, _skJenisCache, idSuratInduk);
  }, function(e){ Loader.hide(); UIHelper.showToast('Gagal memuat: '+e, false); });
}

function skIndukData(id){
  var s = rawDataSurat.find(function(x){ return x.idSurat===id; }); if(!s) return {};
  var out={};
  ['perihal','pengirim','tujuan','nomorSurat','agendaNomor','deskripsi','pic','kontak','penanggungJawab'].forEach(function(k){ if(s[k]) out[k]=s[k]; });
  if (s.tglSurat) out.tglSuratMasuk = s.tglSurat;
  if (s.customFields) Object.keys(s.customFields).forEach(function(k){ out[k]=s.customFields[k]; });
  return out;
}

var _skJenisList=[]; var _skAsal='';

function _renderModalSuratKeluar(asal, suratInduk, jenisList, idSuratInduk) {
  _skJenisList=jenisList||[]; _skAsal=asal;
  var judul = asal==='BALASAN' ? 'Buat Surat Balasan' : 'Catat Surat Keluar Mandiri';
  var defaultJenis='',defaultPerihal='',defaultTujuan='',defaultPenandatangan='';
  if (asal==='BALASAN' && suratInduk) {
    defaultPerihal=suratInduk.perihal||''; defaultTujuan=suratInduk.pengirim||'';
    var kat=kategoriList.find(function(k){ return k.id===suratInduk.kategoriId; });
    if (kat){ defaultJenis=kat.balasanDefault||''; defaultPenandatangan=kat.tujuanDisposisi||''; }
  }
  var match=_skJenisList.find(function(j){ return j.id===defaultJenis||j.nama===defaultJenis; });
  var defaultId=match?match.id:'';
  var infoBox = (asal==='BALASAN')
    ? '<div class="sk-info-box"><i class="bi bi-info-circle me-1"></i> Jenis otomatis dari Kategori. Isian placeholder diambil dari <b>Surat Masuk</b>. Anda hanya isi Nomor, Tanggal & Penandatangan.</div>'
    : '<div class="sk-info-box"><i class="bi bi-info-circle me-1"></i> Surat Mandiri: isian placeholder dari form di bawah.</div>';

  _skOpenDialog('skForm', '<div class="neo-swal-popup neo-dialog-card sk-wide">' +
    '<div class="neo-swal-inner" style="align-items:stretch;">' +
      '<div class="neo-swal-icon" style="color:var(--neo-accent);"><i class="bi bi-envelope-paper-fill"></i></div>' +
      '<div class="neo-swal-title">'+judul+'</div>' +
      '<div class="neo-swal-text" style="font-size:0.75rem;">'+(asal==='BALASAN'?'Membalas: '+(suratInduk?_escSK(suratInduk.perihal):'-'):'Surat keluar inisiatif unit — form menyesuaikan jenis.')+'</div>' +
      '<input type="hidden" id="skAsal" value="'+asal+'">' +
      '<input type="hidden" id="skIdSuratInduk" value="'+(idSuratInduk||'')+'">' +
      '<input type="hidden" id="skUrlDokumen" value="">' +
      '<div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">' +
        '<div><label class="form-label">Jenis Surat Keluar'+(asal==='BALASAN'?' <span style="color:var(--neo-accent);">(otomatis)</span>':'')+'</label>'+neoSelectHtml('NS_skJenis', _skJenisList.map(function(j){return {value:j.id,label:j.nama};}), defaultId, '— pilih jenis —')+'</div>' +
        '<div><label class="form-label">Nomor Surat Keluar <span style="color:#c53030;">*</span></label><input type="text" id="skNomor" class="form-control" placeholder="Ketik / tempel nomor..."><div style="font-size:0.65rem;color:var(--neo-text-muted);margin-top:4px;"><i class="bi bi-info-circle me-1"></i>Salin dari aplikasi nomor kantor</div></div>' +
        '<div><label class="form-label">Tanggal</label><input type="date" id="skTanggal" class="form-control" value="'+_todayYMD()+'"></div>' +
        '<div><label class="form-label">Penandatangan</label><input type="text" id="skPenandatangan" class="form-control" value="'+_escSK(defaultPenandatangan)+'"></div>' +
        '<div style="grid-column:1/-1;"><label class="form-label">Tujuan</label><input type="text" id="skTujuan" class="form-control" value="'+_escSK(defaultTujuan)+'"></div>' +
        '<div style="grid-column:1/-1;"><label class="form-label">Perihal</label><input type="text" id="skPerihal" class="form-control" value="'+_escSK(defaultPerihal)+'"></div>' +
      '</div>' +
      (asal==='MANDIRI' ? '<div class="sk-dyn-title"><i class="bi bi-ui-radios me-1"></i> Isian Sesuai Jenis</div><div id="skDynamicFields" class="row g-2"></div>' : '') +
      '<div style="margin-top:14px;">'+infoBox+'</div>' +
      '<div style="margin-top:14px; padding:12px; background:rgba(102,126,234,0.05); border-radius:12px; border:1px dashed rgba(102,126,234,0.3);">' +
        '<div style="font-size:0.72rem; font-weight:800; color:var(--neo-accent); margin-bottom:8px; text-transform:uppercase;">Dokumen</div>' +
        '<div id="skDocArea"><button type="button" class="dsc-btn-primary" style="margin-bottom:0;width:100%;" onclick="generateDokumenKeluar()"><i class="bi bi-magic me-1"></i> 🚀 Buat Dokumen dari Template</button></div>' +
        '<div id="skDocResult" style="display:none; margin-top:8px;"></div>' +
      '</div>' +
    '</div>' +
    '<div class="neo-dialog-actions">' +
      '<button type="button" class="neo-btn-cancel" onclick="skClose(\'skForm\')">Batal</button>' +
      '<button type="button" class="neo-btn-confirm" onclick="submitSuratKeluar()"><i class="bi bi-save me-1"></i> Simpan</button>' +
    '</div></div>', 9998);

  _neoSelCb['NS_skJenis'] = function(v){ skJenisChanged(v); };
  if (defaultId) skJenisChanged(defaultId); else onSkJenisChange();
}
function onSkJenisChange(){ skJenisChanged(neoSelValue('NS_skJenis')); }
function skJenisChanged(jenisId){
  var j=_skJenisList.find(function(x){return x.id===jenisId;});
  var btn=document.querySelector('#skDocArea button');
  if (btn) btn.innerHTML = (j&&j.mode==='TEMPLATE')?'<i class="bi bi-magic me-1"></i> 🚀 Buat Dokumen dari Template':'<i class="bi bi-link-45deg me-1"></i> 📝 Lewati (Catat Manual Nanti)';
  if (_skAsal!=='MANDIRI') return;
  var box=document.getElementById('skDynamicFields'); if(!box) return;
  if (!jenisId){ box.innerHTML='<div class="col-12" style="font-size:.72rem;color:var(--neo-text-muted);">Pilih jenis dulu.</div>'; return; }
  box.innerHTML='<div class="col-12" style="font-size:.72rem;color:var(--neo-text-muted);">Memuat isian...</div>';
  UIHelper.callApi('apiGetSchemaJenisKeluar', [{idJenis:jenisId}], function(f){ skRenderSchema(Array.isArray(f)?f:[]); }, function(){ box.innerHTML=''; });
}

var skRepValues={};
function skRenderSchema(fields){
  skRepValues={};
  var box=document.getElementById('skDynamicFields'); if(!box) return;
  if(!fields.length){ box.innerHTML='<div class="col-12" style="font-size:.72rem;color:var(--neo-text-muted);">Belum ada isian khusus. Tambah lewat Pengaturan → Jenis & Template → Field Mandiri.</div>'; return; }
  box.innerHTML=fields.map(function(f){
    var idf='skf_'+f.field_key;
    var lbl='<label class="form-label">'+_escSK(f.label)+(f.required?' *':'')+'</label>';
    if(f.tipe==='textarea') return '<div class="col-12">'+lbl+'<textarea id="'+idf+'" class="form-control" rows="2"></textarea></div>';
    if(f.tipe==='select'){ var o=(f.opsi||'').split(',').map(function(x){return '<option>'+_escSK(x)+'</option>';}).join(''); return '<div class="col-md-6">'+lbl+'<select id="'+idf+'" class="form-control">'+o+'</select></div>'; }

(function(){
  if (window.__skScrollPatched) return; window.__skScrollPatched = true;
  var origOpen = _skOpenDialog;
  _skOpenDialog = function(key, html, zIndex){
    var ov = origOpen(key, html, zIndex);
    try {
      var card = ov.querySelector('.neo-swal-popup');
      var inner = card && card.querySelector('.neo-swal-inner');
      var actions = card && card.querySelector('.neo-dialog-actions');
      if (card && inner) {
        var hintEl = card.querySelector('.neo-scroll-hint');
        if (!hintEl) {
          hintEl = document.createElement('div');
          hintEl.className = 'neo-scroll-hint';
          hintEl.innerHTML = '<i class="bi bi-chevron-down"></i> scroll';
          card.appendChild(hintEl);
        }
        hintEl.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);bottom:70px;display:none;align-items:center;gap:5px;width:max-content;font-size:0.66rem;font-weight:800;color:#667eea;background:#eef1f6;box-shadow:4px 4px 10px rgba(163,177,198,.5);padding:4px 13px;border-radius:99px;z-index:7;pointer-events:none;letter-spacing:.3px;';
        card.style.setProperty('position','relative','important');

        var apply = function(){
          var ah = actions ? actions.offsetHeight : 56;
          var maxCard = Math.max(320, window.innerHeight - 48);
          var maxInner = Math.max(200, maxCard - ah - 8);
          card.style.setProperty('max-height', maxCard + 'px', 'important');
          inner.style.setProperty('max-height', maxInner + 'px', 'important');
          inner.style.setProperty('overflow-y', 'scroll', 'important');
        };
        apply(); setTimeout(apply, 120); setTimeout(apply, 600);
        window.addEventListener('resize', apply);

        var upd = function(){
          var scrollable = inner.scrollHeight - inner.clientHeight > 4;
          var atBottom = inner.scrollTop + inner.clientHeight >= inner.scrollHeight - 6;
          hintEl.style.display = (scrollable && !atBottom) ? 'inline-flex' : 'none';
        };
        inner.addEventListener('scroll', upd, { passive:true });
        setTimeout(upd, 200); setTimeout(upd, 700);
        try { new MutationObserver(upd).observe(inner, { childList:true, subtree:true }); } catch(e){}
      }
    } catch(e) { console.error('[skScrollPatch]', e); }
    return ov;
  };
})();
</script>


<script>
/* ============ KELOLA TEMPLATE DISPOSISI PER KATEGORI ============ */
function openModalKelolaTemplateDisposisi(){
  _lcGet('tplDisp', 'apiGetTemplateDisposisiList', function(rows){
    _renderKelolaTemplateDisposisi(Array.isArray(rows)?rows:[]);
  });
}
function _renderKelolaTemplateDisposisi(rows){
  var map={}; rows.forEach(function(r){ map[String(r.kategori_id)]=r; });
  var rowHtml = function(kid, label, val){
    var link = val ? (String(val).indexOf('http')===0 ? val : 'https://docs.google.com/document/d/'+val) : '';
    return '<div class="jk-row" data-kat="'+_escSK(kid)+'" style="grid-template-columns:1.2fr 1.6fr auto;">' +
      '<div style="font-size:.78rem;font-weight:700;color:var(--neo-text-heading);">'+_escSK(label)+'</div>' +
      '<input type="text" class="form-control td-doc" value="'+_escSK(val)+'" placeholder="Tempel ID / URL Google Doc...">' +
      '<div class="d-flex gap-1" style="justify-content:flex-end;">'+
        (link ? '<a class="btn-picker" target="_blank" href="'+_escSK(link)+'" title="Buka template"><i class="bi bi-box-arrow-up-right"></i></a>' : '')+
        '<button type="button" class="schedule-remove-btn" title="Kosongkan" onclick="this.closest(\'.jk-row\').querySelector(\'.td-doc\').value=\'\'"><i class="bi bi-eraser"></i></button>'+
      '</div></div>';
  };
  var html = rowHtml('default','(DEFAULT) Semua kategori', map['default'] ? (map['default'].doc_id||'') : '');
  (kategoriList||[]).forEach(function(k){ html += rowHtml(k.id, k.nama, map[k.id] ? (map[k.id].doc_id||'') : ''); });
  _skOpenDialog('skTplDisp', '<div class="neo-swal-popup neo-dialog-card sk-wide"><div class="neo-swal-inner" style="align-items:stretch;">' +
    '<div class="neo-swal-icon" style="color:var(--neo-accent);"><i class="bi bi-file-earmark-word"></i></div>' +
    '<div class="neo-swal-title">Kelola Template Disposisi per Kategori</div>' +
    '<div class="neo-swal-text" style="font-size:0.72rem;margin-bottom:10px;">Isi ID/URL Google Doc per kategori. Di doc gunakan placeholder dari <b>Kelola Placeholder</b> — mis. {{PERIHAL}}, {{PENGIRIM}}, {{DESKRIPSI}}, {{PEMOHON}}. Kategori kosong memakai DEFAULT.</div>' +
    '<div style="display:grid;grid-template-columns:1.2fr 1.6fr auto;gap:10px;font-size:0.68rem;font-weight:800;color:var(--neo-text-sub);text-transform:uppercase;"><span>Kategori</span><span>Template Doc</span><span>Aksi</span></div>' +
    '<div id="tdBody" style="max-height:380px;overflow-y:auto;">'+html+'</div>' +
  '</div><div class="neo-dialog-actions"><button type="button" class="neo-btn-cancel" onclick="skClose(\'skTplDisp\')">Tutup</button><button type="button" class="neo-btn-confirm" onclick="tdSaveAll()"><i class="bi bi-save me-1"></i> Simpan Semua</button></div></div>', 9999);
}
function tdSaveAll(){
  var rows = document.querySelectorAll('#tdBody .jk-row');
  var tasks=[];
  rows.forEach(function(r){ tasks.push({ kid:r.getAttribute('data-kat'), doc:r.querySelector('.td-doc').value.trim() }); });
  if(!tasks.length) return;
  Loader.show('Menyimpan template disposisi...');
  var done=0;
  var finish=function(){ done++; if(done===tasks.length){ Loader.hide(); _lcInvalidate(); UIHelper.showToast('Template disposisi tersimpan.',true); _skCloseDialog('skTplDisp'); } };
  tasks.forEach(function(t){
    if (t.doc) UIHelper.callApi('apiSimpanTemplateDisposisiDoc',[{kategoriId:t.kid, docId:t.doc, namaTemplate:t.kid}], finish, finish);
    else UIHelper.callApi('apiHapusTemplateDisposisiDoc',[{kategoriId:t.kid}], finish, finish);
  });
}
</script>

<script>
/* ============ ARSIP SURAT KELUAR — RENDERER PASTI ============ */
var skFilterStatus = (typeof skFilterStatus !== 'undefined') ? skFilterStatus : 'ALL';
var _skScanTargetId = null;

function setSkFilter(v){ skFilterStatus = v; renderSuratKeluarList(); }
function onSkSearch(){ renderSuratKeluarList(); }

function _skAsal(r){ return (r.asal === 'BALASAN' || r.idSuratInduk) ? 'BALASAN' : 'MANDIRI'; }
function _skIsFinal(r){ return String(r.status).toUpperCase() === 'FINAL'; }

function renderSuratKeluarList() {
  var wrap = document.getElementById('skListWrap');
  if (!wrap) return;
  var data = (typeof rawDataSuratKeluar !== 'undefined' && rawDataSuratKeluar) ? rawDataSuratKeluar : [];

  var q = ((document.getElementById('skSearchInput') || {}).value || '').toLowerCase().trim();
  var searched = q ? data.filter(function(r){
    return (r.nomorKeluar||'').toLowerCase().includes(q) ||
           (r.perihal||'').toLowerCase().includes(q) ||
           (r.tujuan||'').toLowerCase().includes(q) ||
           (r.jenis_nama||'').toLowerCase().includes(q);
  }) : data;

  var cAll = searched.length, cBalasan = 0, cMandiri = 0;
  searched.forEach(function(r){ if (_skAsal(r) === 'BALASAN') cBalasan++; else cMandiri++; });
  var set = function(id, v){ var e = document.getElementById(id); if (e) e.innerText = v; };
  set('sksegCount-ALL', cAll); set('sksegCount-BALASAN', cBalasan); set('sksegCount-MANDIRI', cMandiri);
  ['ALL','BALASAN','MANDIRI'].forEach(function(v){
    var b = document.getElementById('skseg-' + v);
    if (b) b.classList.toggle('active', v === skFilterStatus);
  });

  var list = searched.filter(function(r){
    if (skFilterStatus === 'ALL') return true;
    return _skAsal(r) === skFilterStatus;
  });

  if (!list.length) {
    wrap.innerHTML = '<div class="sk-empty"><i class="bi bi-envelope-paper"></i>Belum ada surat keluar.</div>';
    return;
  }

  wrap.innerHTML = list.map(function(r){
    var id = r.idKeluar;
    var asal = _skAsal(r);
    var isFinal = _skIsFinal(r);
    var asalChip = asal === 'BALASAN'
      ? '<span class="sk-chip-asal sk-chip-balasan">Balasan</span>'
      : '<span class="sk-chip-asal sk-chip-mandiri">Mandiri</span>';
    var statusChip = isFinal
      ? '<span class="chip-soft chip-active">FINAL ✔</span>'
      : '<span class="chip-soft chip-accent">Tercatat</span>';

    var docBtn = r.urlDokumen
      ? '<a class="dsc-btn-action" title="Buka Dokumen" target="_blank" href="' + esc(r.urlDokumen) + '"><i class="bi bi-file-earmark-text"></i></a>'
      : '<span class="dsc-btn-action" style="opacity:.35;" title="Dokumen belum dibuat"><i class="bi bi-file-earmark-text"></i></span>';

    var scanBtn = (!isFinal)
      ? '<button class="dsc-btn-action" title="Upload Scan → FINAL" onclick="skPickScan(\'' + esc(id) + '\')"><i class="bi bi-upload"></i></button>'
      : (r.urlScan
          ? '<a class="dsc-btn-action" title="Lihat Scan" target="_blank" href="' + esc(r.urlScan) + '"><i class="bi bi-paperclip"></i></a>'
          : '');

    var indukLink = (asal === 'BALASAN' && r.idSuratInduk)
      ? '<button class="sk-link-induk" onclick="skGoInduk(\'' + esc(r.idSuratInduk) + '\')"><i class="bi bi-arrow-return-left"></i> Lihat Induk</button>'
      : '';

    var tgl = r.tglKeluar ? _shortDate(r.tglKeluar) : '-';
    var nomorTampil = (r.nomorKeluar||'-').length > 14 ? (r.nomorKeluar.substring(0,12)+'…') : (r.nomorKeluar||'-');

    return '' +
    '<div class="sk-card">' +
      '<div class="sk-inner">' +
        '<div class="sk-row1">' +
          '<span class="sm-agenda-pill sk-agenda">' + esc(nomorTampil) + '</span>' +
          '<div class="sk-body">' +
            '<div class="sk-perihal">' + esc(r.perihal || '(tanpa perihal)') + '</div>' +
            '<div class="sk-meta"><i class="bi bi-building me-1"></i>' + esc(r.tujuan || '-') +
              (r.jenis_nama ? ' · ' + esc(r.jenis_nama) : '') + ' · <i class="bi bi-calendar3 me-1"></i>' + esc(tgl) + '</div>' +
          '</div>' +
          '<div class="sk-badges">' + asalChip + statusChip + '</div>' +
          '<div class="sk-actions">' + indukLink + docBtn + scanBtn + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function skPickScan(id){
  _skScanTargetId = id;
  var inp = document.getElementById('skScanFile');
  if (inp){ inp.value = ''; inp.click(); }
}
function onSkScanPicked(ev){
  var file = ev.target.files && ev.target.files[0];
  if (!file || !_skScanTargetId) return;
  Loader.show('Mengunggah scan & menandai FINAL...');
  var reader = new FileReader();
  reader.onload = function(e){
    var payload = { id: _skScanTargetId, fileScan: { base64: e.target.result, fileName: file.name, mimeType: file.type }, user: currentUser };
    UIHelper.callApi('apiUpdateFinalSuratKeluar', [payload], function(res){
      Loader.hide();
      UIHelper.showToast((res && res.message) || 'Scan tersimpan & status FINAL.', true);
      if (typeof skReload === 'function') skReload(); else if (typeof refreshCoreData === 'function') refreshCoreData();
    }, function(err){ Loader.hide(); UIHelper.showToast('Gagal: ' + err, false); });
  };
  reader.readAsDataURL(file);
}

function skGoInduk(idSuratMasuk){
  if (typeof switchPage === 'function') switchPage('page-surat-masuk');
  setTimeout(function(){ if (typeof openModalDetailSurat === 'function') openModalDetailSurat(idSuratMasuk); }, 250);
}
</script>


<script>
/* ============ SK RELOAD v2 ============ */
(function(){
  window.skReload = function(cb){
    var done = function(d){
      rawDataSuratKeluar = Array.isArray(d) ? d : (d && Array.isArray(d.data) ? d.data : []);
      if (typeof renderSuratKeluarList === 'function') renderSuratKeluarList();
      if (cb) cb();
    };
    UIHelper.callApi('apiGetDaftarSuratKeluar', [], done, function(err1){
      UIHelper.callApi('apiGetSuratKeluar', [], done, function(err2){
        rawDataSuratKeluar = [];
        if (typeof renderSuratKeluarList === 'function') renderSuratKeluarList();
        UIHelper.showToast('Gagal memuat arsip: ' + err2, false);
        if (cb) cb();
      });
    });
  };
  window.skReload();
})();
</script>

<script>
/* ============ Konfirmasi: buat ulang balasan (SAFE) ============ */
(function(){
  if (window.__submitSKConfirm) return;

  /* PATCHED: tunggu submitSuratKeluar tersedia */
  window._whenReady('submitSuratKeluar', function(origSubmit){
    window.__submitSKConfirm = true;
    window.submitSuratKeluar = function(){
      var elA = document.getElementById('skAsal'), elI = document.getElementById('skIdSuratInduk');
      var asal = elA ? elA.value : '', induk = elI ? elI.value : '';
      if (asal === 'BALASAN' && induk) {
        var ex = null, list = (typeof rawDataSuratKeluar !== 'undefined' && rawDataSuratKeluar) ? rawDataSuratKeluar : [];
        for (var i=0;i<list.length;i++) if (String(list[i].idSuratInduk) === String(induk)) { ex = list[i]; break; }
        if (ex) {
          Swal.fire({
            title: 'Sudah ada balasan untuk surat ini',
            html: 'Status lama: <b>' + (ex.status || '-') + '</b>.<br>Membuat lagi akan <b>MENGGANTIKAN</b> catatan lama.',
            icon: 'warning', showCancelButton: true,
            confirmButtonText: 'Ya, Gantikan', cancelButtonText: 'Batal'
          }).then(function(r){ if (r.isConfirmed) { try { origSubmit.apply(this, arguments); } catch(e){} } }.bind(this));
          return;
        }
      }
      try { origSubmit.apply(this, arguments); } catch(e){ console.warn('[submitSuratKeluar confirm]', e); }
    };
  });
})();
</script>

<script>
/* ============ BATCH 1: scan-btn, row-click, refresh (SAFE) ============ */
(function(){
  if (window.__batch1) return;

  function smEnhance(){
    var wells = document.querySelectorAll('.sm-well');
    for (var wI = 0; wI < wells.length; wI++) {
      var w = wells[wI];
      var btn = w.querySelector('[onclick*="openModalDetailSurat"]');
      if (!btn) continue;
      var m = btn.getAttribute('onclick').match(/openModalDetailSurat\('([^']+)'\)/);
      if (!m) continue;
      var id = m[1];
      var s = null;
      for (var i = 0; i < (rawDataSurat || []).length; i++) if (rawDataSurat[i].idSurat === id) { s = rawDataSurat[i]; break; }

      var grp = w.querySelector('.action-btn-group');
      if (grp && s && s.urlScan && !grp.querySelector('.sm-scan-btn')) {
        grp.insertAdjacentHTML('afterbegin',
          '<a class="dsc-btn-action sm-scan-btn" title="Lihat Scan Surat" target="_blank" href="' + s.urlScan + '"><i class="bi bi-paperclip"></i></a>');
      }

      var main = w.querySelector('.sm-main');
      if (main) {
        main.setAttribute('data-sk-id', id);
        main.style.cursor = 'pointer';
        if (!main.__rowClick) {
          main.__rowClick = true;
          main.addEventListener('click', function(e){
            if (e.target.closest('button, a, input, select, textarea')) return;
            openModalDetailSurat(this.getAttribute('data-sk-id'));
          });
        }
      }
    }
  }

  function skAddRefresh(){
    var act = document.querySelector('#skToolbar .sm-actions');
    if (act && !act.querySelector('.sk-refresh-btn')) {
      act.insertAdjacentHTML('afterbegin',
        '<button type="button" class="sm-btn-subtle sk-refresh-btn" onclick="skReload()"><i class="bi bi-arrow-clockwise"></i> Segarkan</button>');
    }
  }
  setTimeout(skAddRefresh, 300);

  /* PATCHED: tunggu renderSuratTable tersedia */
  window._whenReady('renderSuratTable', function(origRender){
    if (window.__batch1) return;
    window.__batch1 = true;
    window.renderSuratTable = function(){
      var r;
      try { r = origRender.apply(this, arguments); } catch(e){ console.warn('[Batch1 renderSuratTable]', e); }
      setTimeout(smEnhance, 60);
      return r;
    };
    setTimeout(smEnhance, 400);
  });
})();
</script>


<script>
/* ============ BATCH 1 (A2+A5): form keputusan ramping (SAFE) ============ */
(function(){
  if (window.__batch1b) return;

  function _kepPerluFrom(r){
    if (!r) return null;
    if (r.perluBalasan === true || r.perluBalasan === 'Y' || r.perluBalasan === 'Ya' || r.perluBalasan === 'TRUE') return true;
    if (r.perluBalasan === false || r.perluBalasan === 'T' || r.perluBalasan === 'FALSE') return false;
    var c = String(r.catatan || '').toLowerCase();
    if (c.indexOf('tidak perlu balasan') !== -1) return false;
    if (c.indexOf('perlu balasan') !== -1) return true;
    return null;
  }

  /* PATCHED: tunggu renderEkspedisiInline tersedia */
  window._whenReady('renderEkspedisiInline', function(origExp){
    if (window.__batch1b) return;
    window.__batch1b = true;

    window.renderEkspedisiInline = function (riwayat) {
      var r;
      try { r = origExp.apply(this, arguments); } catch(e){ console.warn('[batch1b renderEkspedisiInline]', e); }

      window.__expRiwayat = riwayat || [];
      var s = rawDataSurat.find(function (x) { return x.idSurat === currentEkspedisiId; });
      var tEl = document.getElementById('ekspedisiTitle');
      if (tEl) tEl.innerHTML = '<i class="bi bi-box-seam" style="color:var(--neo-accent);"></i> Ekspedisi: ' + UIHelper.escapeHtml(s ? s.agendaNomor + ' — ' + s.perihal : currentEkspedisiId);

      var done = {}; (riwayat || []).forEach(function (r) { done[r.tahap] = r; });
      var batalNow = (s && s.status === 'BATAL') || (!!done['dibatalkan'] && !done['diaktifkan_kembali']);

      var tl = document.getElementById('ekspedisiTimeline');
      if (tl) {
        tl.innerHTML = TAHAP_ORDER.map(function (t, i) {
          if ((t === 'balasan' || t === 'diterima') && done['selesai_tanpa_balasan']) return '';
          if (t === 'selesai_tanpa_balasan' && (done['balasan'] || done['diterima'])) return '';
          var r = done[t], last = i === TAHAP_ORDER.length - 1;
          return '<div class="tl-item ' + (r ? '' : 'future') + '">' + (last ? '' : '<div class="tl-line"></div>') +
            '<div class="tl-dot"></div><div><div class="tl-judul">' + (TAHAP_LABEL[t] || t) + '</div>' +
            '<div class="tl-meta">' + (r ? (r.timestamp + ' · ' + r.aktor + (r.catatan ? ' — ' + r.catatan : '')) : 'menunggu') + '</div></div></div>';
        }).join('');
      }

      var act = '';
      if (batalNow) {
        var rb = (riwayat || []).filter(function (r) { return r.tahap === 'dibatalkan'; })[0];
        act = '<div class="wizard-step"><div class="wizard-step-title" style="color:var(--neo-status-inactive);"><i class="bi bi-x-octagon-fill"></i> Dibatalkan</div>' +
          '<div style="font-size:.8rem; color:var(--neo-text-sub); font-weight:600;">' + (rb ? UIHelper.escapeHtml(rb.timestamp + ' · ' + rb.aktor + (rb.catatan ? ' — ' + rb.catatan : '')) : 'Tanpa catatan.') + '</div>' +
          '<div class="text-end mt-2"><button class="dsc-btn-primary" style="margin-bottom:0;" onclick="aksiAktifkan(\'' + currentEkspedisiId + '\')"><i class="bi bi-arrow-counterclockwise"></i> Aktifkan Kembali</button></div></div>';
      } else if (done['selesai_tanpa_balasan'] || done['diterima']) {
        act += '<span class="badge-status active">Ekspedisi selesai ✔</span>';
        act += '<div class="text-end mt-2"><button type="button" class="btn-guest-action" style="padding:8px 16px; border-radius:999px; font-size:.75rem; color:var(--neo-status-inactive);" onclick="openDialogBatalkan(\'' + currentEkspedisiId + '\')"><i class="bi bi-x-octagon"></i> Batalkan Kegiatan</button></div>';
      } else {
        if (!done['tercetak']) act += '<button class="dsc-btn-primary" style="margin-bottom:0;" onclick="aksiTercetak()"><i class="bi bi-printer"></i> Tandai Tercetak & Diserahkan</button>';

        var showKepForm = (done['tercetak'] && !done['keputusan']) || window.__editKeputusan;
        if (showKepForm) {
          act += '<div class="wizard-step"><div class="wizard-step-title"><i class="bi bi-pencil-square"></i> ' + (window.__editKeputusan ? 'Edit Keputusan Pimpinan' : 'Catat Keputusan Pimpinan') + '</div>' +
            '<textarea id="kepText" class="form-control" rows="2" placeholder="Instruksi pimpinan..."></textarea>' +
            '<div class="row g-2 mt-1">' +
            '<div class="col-12" style="font-size:.72rem; font-weight:700; color:var(--neo-text-sub); text-transform:uppercase; margin-bottom:4px;">Apakah perlu surat balasan? <span style="color:var(--neo-status-inactive);">*</span></div>' +
            '<div class="col-md-6"><div class="switch-card"><input class="form-check-input" type="radio" name="kepPerluBalasan" id="kepPerluY" value="Y"><label class="form-check-label" for="kepPerluY" style="font-size:.8rem; font-weight:700; margin:0; color:var(--neo-status-active);"><i class="bi bi-check-circle-fill me-1"></i> Ya, perlu balasan</label></div></div>' +
            '<div class="col-md-6"><div class="switch-card"><input class="form-check-input" type="radio" name="kepPerluBalasan" id="kepPerluT" value="T"><label class="form-check-label" for="kepPerluT" style="font-size:.8rem; font-weight:700; margin:0; color:var(--neo-text-sub);"><i class="bi bi-x-circle me-1"></i> Tidak perlu</label></div></div>' +
            '</div>' +
            '<div class="text-end mt-2"><button class="dsc-btn-primary" style="margin-bottom:0;" onclick="submitKeputusan()"><i class="bi bi-save"></i> Simpan Keputusan</button>' +
            (window.__editKeputusan ? ' <button class="btn-guest-action" style="padding:8px 16px; border-radius:999px; font-size:.75rem;" onclick="batalEditKeputusan()"><i class="bi bi-x"></i> Batal Edit</button>' : '') +
            '</div></div>';
        }

        if (done['keputusan'] && !done['selesai_tanpa_balasan']) {
          if (!window.__editKeputusan) {
            act += '<button type="button" class="btn-guest-action" style="padding:8px 16px; border-radius:999px; font-size:.75rem; color:var(--neo-accent);" onclick="editKeputusanDisp()"><i class="bi bi-pencil"></i> Edit Keputusan</button>';
          }
          var perlu2 = _kepPerluFrom(done['keputusan']);
          if (perlu2) {
            act += '<button class="dsc-btn-primary" style="margin-bottom:0;" onclick="openModalSuratKeluar(\'BALASAN\', \'' + currentEkspedisiId + '\')">' +

(function(){

<script>
/* ============ UX BALASAN: satu klik = generate + simpan (SAFE) ============ */
(function(){
  if (window.__balasanUx) return;

  function commitSuratKeluar(){
    var asal = document.getElementById('skAsal').value;
    var idInduk = document.getElementById('skIdSuratInduk').value;

    var jenis = neoSelValue('NS_skJenis');

    if (!nomor) { UIHelper.showToast('Nomor wajib diisi.', false); document.getElementById('skNomor').focus(); return; }
    if (!document.getElementById('skPerihal').value.trim()) { UIHelper.showToast('Perihal wajib diisi.', false); return; }
    var j = null; for (var i = 0; i < _skJenisList.length; i++) if (_skJenisList[i].id === jenis) j = _skJenisList[i];

    var proceed = function(){
      var doSave = function(urlDokumen){
        var data = { nomorKeluar: nomor, tglKeluar: document.getElementById('skTanggal').value, jenisKeluar: jenis,
          perihal: document.getElementById('skPerihal').value.trim(), tujuan: document.getElementById('skTujuan').value.trim(),
          penandatangan: document.getElementById('skPenandatangan').value.trim(), asal: asal, idSuratInduk: idInduk,
          urlDokumen: urlDokumen, urlScan: '', status: 'TERCATAT' };
        if (asal === 'BALASAN' && idInduk) Object.assign(data, skIndukData(idInduk)); else Object.assign(data, skCollectDynamic());
        Loader.show('Menyimpan surat keluar...');
        UIHelper.callApi('apiSimpanSuratKeluar', [{ data: data }], function(r){
          Loader.hide(); UIHelper.showToast(r.message || 'Tersimpan.', true);
          _skCloseDialog('skForm');
          if (typeof skReload === 'function') skReload();
          if (typeof _refreshEkspedisi === 'function') setTimeout(function(){ _refreshEkspedisi(); }, 400);
        }, function(e){ Loader.hide(); UIHelper.showToast('Gagal: ' + e, false); });
      };
      if (j && j.mode === 'TEMPLATE') {
        Loader.show('Membuat dokumen...');
        var gd = { jenisKeluar: jenis, nomorKeluar: nomor, perihal: document.getElementById('skPerihal').value.trim(),
          tujuan: document.getElementById('skTujuan').value.trim(), tglKeluar: document.getElementById('skTanggal').value,
          penandatangan: document.getElementById('skPenandatangan').value.trim(), pemohon: '' };
        if (asal === 'BALASAN' && idInduk) { Object.assign(gd, skIndukData(idInduk)); gd.pemohon = gd.pengirim || ''; }
        else Object.assign(gd, skCollectDynamic());
        UIHelper.callApi('apiGenerateDokumenKeluar', [{ data: gd, user: currentUser }], function(res){
          if (res && res.success && res.url) doSave(res.url);
          else { Loader.hide(); UIHelper.showToast((res && res.message) || 'Gagal membuat dokumen.', false); }
        }, function(e){ Loader.hide(); UIHelper.showToast('Gagal: ' + e, false); });
      } else {
        doSave('');
      }
    };

    if (asal === 'BALASAN' && idInduk) {
      var ex = null, list = (typeof rawDataSuratKeluar !== 'undefined' && rawDataSuratKeluar) ? rawDataSuratKeluar : [];
      for (var k = 0; k < list.length; k++) if (String(list[k].idSuratInduk) === String(idInduk)) { ex = list[k]; break; }
      if (ex) {
        Swal.fire({ title: 'Sudah ada balasan untuk surat ini', html: 'Status lama: <b>' + (ex.status || '-') + '</b>.<br>Melanjutkan akan <b>MENGGANTIKAN</b> catatan lama.',
          icon: 'warning', showCancelButton: true, confirmButtonText: 'Ya, Gantikan', cancelButtonText: 'Batal'
        }).then(function(r){ if (r.isConfirmed) proceed(); });
        return;
      }
    }
    proceed();
  }

  function tuneForm(){
    var d = _skDialogs['skForm'];

      setTimeout(function(){ tuneForm(); tuneLabel(); }, 60);
      return r;
    };
  });

  /* PATCHED: tunggu skJenisChanged tersedia */
  window._whenReady('skJenisChanged', function(origJenisChanged){
    if (window.__balasanUxJenis) return;

      setTimeout(tuneLabel, 30);
      return r;
    };

  window._whenReady('submitSuratKeluar', function(){

  window._whenReady('generateDokumenKeluar', function(){
    if (window.__balasanUxGen) return;
    window.__balasanUxGen = true;
    window.generateDokumenKeluar = commitSuratKeluar;
  });
})();

function tambahTransformasiRow(){ document.getElementById('trBody').insertAdjacentHTML('beforeend', _trRowHtml()); }
function simpanTransformasiAll(){

  });
  var removed = _trOriginalIds.filter(function(id){ return !present[id]; });
  if (!tasks.length && !removed.length) { UIHelper.showToast('Tidak ada perubahan.', false); return; }
  Loader.show('Menyimpan transformasi...');
  var total = tasks.length + removed.length, done = 0;
  var finish = function(){ done++; if (done===total){ Loader.hide(); _lcInvalidate(); UIHelper.showToast('Transformasi tersimpan.', true); _skCloseDialog('skTransform'); } };
  tasks.forEach(function(t){ UIHelper.callApi('apiSimpanTransformasiPH', [t], finish, finish); });

}


/* ============ B9: field jadwal cerdas untuk surat keluar (balasan) (SAFE) ============ */
function skSmartWaktu(wM, wS){
  var f = function(v){ return String(v||'').replace(':','.'); };
  var a = f(wM); if (!a) return '-';
  var b = String(wS||'').trim().toLowerCase();
  if (!b || b==='selesai' || b==='s.d. selesai') return a + ' WIB s.d. selesai';
  return a + ' - ' + f(wS) + ' WIB';
}
function skSmartJadwal(jl){
  var t=[],l=[],w=[];
  (jl||[]).forEach(function(j){
    if (j.tempatKegiatan) l.push(j.tempatKegiatan);
    var d = j.tglMulai || j.tglKegiatan; if (d) t.push(d);
    w.push(skSmartWaktu(j.waktuMulai, j.waktuSelesai));
  });
  return { tempatKegiatan: l.join(' ; ')||'-', tglKegiatan: t.join(' ; ')||'-', waktuKegiatan: w.join(' ; ')||'-' };
}
(function(){
  /* PATCHED: tunggu skIndukData tersedia */
  window._whenReady('skIndukData', function(origInduk){
    if (window.__skIndukDataB9) return;
    window.__skIndukDataB9 = true;
    window.skIndukData = function(id){
      var out;
      try { out = origInduk(id); } catch(e){ console.warn('[B9 skIndukData]', e); out = {}; }
      var s = null; for (var i=0;i<(rawDataSurat||[]).length;i++) if (rawDataSurat[i].idSurat===id) { s = rawDataSurat[i]; break; }
      if (s && (s.jadwalList||[]).length) out = Object.assign(out, skSmartJadwal(s.jadwalList));
      return out;
    };
  });
})();

  window._whenReady('renderEkspedisiInline', function(orig){

    window.renderEkspedisiInline = function(riwayat){
      var r2 = riwayat || [];
      var buka=null, diterima=null, selesaiTB=null;
      r2.forEach(function(x){ if(x.tahap==='dibuka_kembali') buka=x; if(x.tahap==='diterima') diterima=x; if(x.tahap==='selesai_tanpa_balasan') selesaiTB=x; });
      var unlocked = buka && (
        (!diterima && !selesaiTB) ||
        (diterima && diterima.timestamp < buka.timestamp) ||
        (!diterima && selesaiTB && selesaiTB.timestamp < buka.timestamp)
      );
      if (unlocked) r2 = r2.filter(function(x){ return x.tahap !== 'diterima' && x.tahap !== 'selesai_tanpa_balasan'; });
      var r;
      try { r = orig.call(this, r2); } catch(e){ console.warn('[__flexExp]', e); }
      setTimeout(function(){
        var aEl = document.getElementById('ekspedisiAction');
        if (!aEl) return;

<script>
/* ============ BOOT CEPAT: render instan dari cache (SAFE) ============ */
(function(){
  if (window.__bootFast) return; window.__bootFast = true;

  function _applyBoot(d){
    if (!d) return;
    if (d.surat) rawDataSurat = d.surat;
    if (d.kategori) kategoriList = d.kategori;
    if (d.ekspedisi) ekspedisiMap = d.ekspedisi;
    if (d.masterAset) masterAset = d.masterAset;
    if (d.masterOrang) masterOrang = d.masterOrang;
    if (d.suratKeluar) rawDataSuratKeluar = d.suratKeluar;
    if (d.jenisKeluar) _skJenisCache = d.jenisKeluar;
    if (d.agenda) _agendaList = d.agenda;
    if (d.liburManual) _liburManual = d.liburManual;
    _lcCache.tplKeluar = d.templates || [];
    _lcCache.placeholder = d.placeholders || [];
    _lcCache.fieldKeys = d.fieldKeys || [];
    _lcCache.tplDisp = d.tplDisp || [];
    _lcCache.transform = d.transforms || [];
    try {
      if (typeof renderDashboard === 'function') renderDashboard(rawDataSurat);
      if (typeof renderSuratTable === 'function') renderSuratTable(rawDataSurat);
      if (typeof renderSidebarAgenda === 'function') renderSidebarAgenda();
      if (typeof renderConventionalCalendar === 'function') renderConventionalCalendar();
      if (typeof renderSuratKeluarList === 'function') renderSuratKeluarList();
    } catch (e) {}
  }

  function showSync(state){
    var el = document.getElementById('lcSyncPill');
    if (!el) {
      el = document.createElement('div'); el.id = 'lcSyncPill';
      el.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:12000;background:var(--neo-surface);box-shadow:var(--neo-soft-raised);border-radius:999px;padding:6px 14px;font-size:.68rem;font-weight:800;color:var(--neo-text-sub);display:flex;gap:6px;align-items:center;transition:opacity .4s;';
      document.body.appendChild(el);
    }
    el.style.opacity = '1';
    el.innerHTML = state === 'sync'
      ? '<span class="spinner-border spinner-border-sm" style="width:.7rem;height:.7rem;"></span> Menyinkronkan…'
      : '<i class="bi bi-check-circle-fill" style="color:var(--neo-status-active);"></i> Tersinkron';
    if (state === 'done') setTimeout(function(){ el.style.opacity = '0'; }, 1800);
  }

  window.loadAllData = function(){
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem('lcBoot') || 'null'); } catch (e) {}
    if (cached) _applyBoot(cached);
    showSync('sync');
    UIHelper.callApi('apiBoot', [], function(d){
      try { localStorage.setItem('lcBoot', JSON.stringify(d)); } catch (e) {}
      _applyBoot(d);
      showSync('done');
    }, function(){ showSync('done'); }, true);
  };
})();
</script>

<script>
/* ============ EKSPEDISI: banner status + jejak audit (ANTI-KEDIP) ============ */
(function(){
  if (window.__expBannerAudit) return;

  function tahapLabel(t){ return (window.TAHAP_LABEL && TAHAP_LABEL[t]) || t; }

  function decorate(riwayat){
    var tl = document.getElementById('ekspedisiTimeline');
    if (!tl) return;
    riwayat = riwayat || window.__expRiwayat || [];
    var done = {}; riwayat.forEach(function(x){ done[x.tahap] = x; });
    var s = null;
    for (var i=0;i<(rawDataSurat||[]).length;i++) if (rawDataSurat[i].idSurat===currentEkspedisiId){ s=rawDataSurat[i]; break; }

    /* 1) hapus milestone cabang dari jalur linier */
    tl.querySelectorAll('.tl-item').forEach(function(item){
      var j = item.querySelector('.tl-judul');
      if (j && (j.textContent==='Dibatalkan' || j.textContent==='Diaktifkan kembali')) item.remove();
    });

    /* 2) banner batal — reuse node */
    var batalNow = (s && s.status==='BATAL') || (!!done['dibatalkan'] && !done['diaktifkan_kembali']);
    var oldB = document.getElementById('expBanner');
    if (batalNow && done['dibatalkan']) {
      var b = done['dibatalkan'];
      var bannerHtml = '<i class="bi bi-x-octagon-fill"></i><div>Kegiatan dibatalkan · ' + UIHelper.escapeHtml(b.timestamp||'') + (b.catatan ? (' — ' + UIHelper.escapeHtml(b.catatan)) : '') + '</div>';
      if (oldB) { if (oldB.innerHTML !== bannerHtml) oldB.innerHTML = bannerHtml; }
      else tl.insertAdjacentHTML('beforebegin', '<div id="expBanner" class="exp-banner batal">' + bannerHtml + '</div>');
    } else if (oldB) { oldB.remove(); }

    /* 3) jejak audit — REUSE node <details>, JANGAN remove+reinsert (ini penyebab kedip) */
    var oldA = document.getElementById('expAudit');
    if (riwayat.length) {
      var items = riwayat.map(function(r){
        return '<div class="exp-audit-item"><span class="t">' + tahapLabel(r.tahap) + '</span> · ' +
          UIHelper.escapeHtml(r.timestamp||'') + ' · ' + UIHelper.escapeHtml(r.aktor||'') +
          (r.catatan ? (' — ' + UIHelper.escapeHtml(r.catatan)) : '') + '</div>';
      }).join('');
      var sumHtml = '<i class="bi bi-journal-text me-1"></i>Jejak Audit Lengkap (' + riwayat.length + ' peristiwa)';
      if (oldA) {
        var list = oldA.querySelector('.exp-audit-list');
        if (list && list.innerHTML !== items) list.innerHTML = items;
        var sum = oldA.querySelector('summary');
        if (sum && sum.innerHTML !== sumHtml) sum.innerHTML = sumHtml;
      } else {
        tl.insertAdjacentHTML('afterend',
          '<details id="expAudit" class="exp-audit"><summary>' + sumHtml + '</summary><div class="exp-audit-list">' + items + '</div></details>');
      }
    } else if (oldA) { oldA.remove(); }
  }

  window._whenReady('renderEkspedisiInline', function(orig){
    if (window.__expBannerAudit) return;
    window.__expBannerAudit = true;
    window.renderEkspedisiInline = function(riwayat){
      var r; try { r = orig.apply(this, arguments); } catch(e){}
      setTimeout(function(){ decorate(riwayat); }, 90);
      return r;
    };
  });
})();
</script>
