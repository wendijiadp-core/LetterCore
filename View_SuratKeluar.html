<section id="sec-surat-keluar" style="display:flex; flex-direction:column; height:100%; min-height:0;">

  <!-- TOOLBAR -->
  <div class="sm-toolbar" id="skToolbar">
    <div class="sm-toolbar-row1">
      <div class="search-box-v2 sm-search">
        <i class="bi bi-search"></i>
        <input type="text" id="skSearchInput" placeholder="Cari nomor, perihal, tujuan, jenis..." onkeyup="onSkSearch()">
      </div>
      <div class="sm-actions">
        <button class="btn-cta-neo" onclick="openModalSuratKeluar('MANDIRI')"><i class="bi bi-plus-lg"></i> Catat Surat Keluar</button>
      </div>
    </div>
    <div class="sm-segment" id="skSegment">
      <button class="sm-seg active" id="skseg-ALL" onclick="setSkFilter('ALL')">Semua <span class="sm-seg-count" id="sksegCount-ALL">0</span></button>
      <button class="sm-seg" id="skseg-BALASAN" onclick="setSkFilter('BALASAN')">Balasan <span class="sm-seg-count" id="sksegCount-BALASAN">0</span></button>
      <button class="sm-seg" id="skseg-MANDIRI" onclick="setSkFilter('MANDIRI')">Mandiri <span class="sm-seg-count" id="sksegCount-MANDIRI">0</span></button>
    </div>
  </div>

  <!-- DAFTAR KARTU -->
  <div class="sm-table-wrap" id="skListWrap"></div>

</section>

<!-- input file tersembunyi untuk upload scan -->
<input type="file" id="skScanFile" accept="image/*,application/pdf" style="display:none;" onchange="onSkScanPicked(event)">
