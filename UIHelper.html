var UIHelper = (function () {
  'use strict';
  function callApi(serverFunctionName, args, onSuccess, onError, silent) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      if (typeof onError === 'function') onError('Environment context error.');
      return;
    }
    var runner = google.script.run
      .withSuccessHandler(function (response) {
        if (response && (response.success === true || response.status === 'success')) {
          var payloadData = (response.data !== undefined) ? response.data : response;
          if (typeof onSuccess === 'function') onSuccess(payloadData, response.message || 'Success');
        } else {
          var errMsg = response ? (response.message || response.error || 'Unknown Server Error') : 'Server returned no response';
          if (!silent) Notify.show('error', 'Gagal', errMsg);
          if (typeof onError === 'function') onError(errMsg, response);
        }
      })
      .withFailureHandler(function (err) {
        var errMsg = (err && err.message) ? err.message : 'Execution Failed';
        if (!silent) Notify.show('error', 'Gagal', errMsg);
        if (typeof onError === 'function') onError(errMsg, err);
      });
    if (typeof runner[serverFunctionName] !== 'function') {
      if (typeof onError === 'function') onError('Function ' + serverFunctionName + ' undefined');
      return;
    }
    runner[serverFunctionName].apply(runner, args || []);
  }
  function showToast(message, isSuccess) { Notify.show(isSuccess ? 'success' : 'error', '', message); }
  function formatDateIndo(dateString) {
    if (!dateString || dateString === '-' || dateString === 'null') return '-';
    var cleanStr = String(dateString).trim();
    if (cleanStr.indexOf('T') !== -1) cleanStr = cleanStr.split('T')[0];
    var parts = cleanStr.split('-');
    if (parts.length === 3) {
      try {
        var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        if (!isNaN(d.getTime())) return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (e) {}
    }
    return dateString;
  }
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
  return { callApi: callApi, showToast: showToast, formatDateIndo: formatDateIndo, escapeHtml: escapeHtml };
})();

/* ================= PROGRESS BAR ================= */
function neoProgress(on) {
  var b = document.getElementById('neoProgressBar');
  if (on) {
    if (!b) {
      b = document.createElement('div');
      b.id = 'neoProgressBar';
      b.className = 'neo-progress';
      b.innerHTML = '<div></div>';
      document.body.appendChild(b);
    }
    b.classList.add('on');
  } else if (b) {
    b.classList.remove('on');
  }
}

/* ================= UTILITAS UX ================= */
function neoFit(t) {
  if (!t || !t.matches || !t.matches('textarea.form-control')) return;
  t.style.height = 'auto';
  t.style.height = (t.scrollHeight + 2) + 'px';
}
function neoFitTextareas(root) {
  var scope = root || document;
  scope.querySelectorAll('textarea.form-control').forEach(neoFit);
}

function fTipeChange() {
  var v = document.getElementById('fTipe').value;
  var w = document.getElementById('wrapFOpsi');
  var l = document.getElementById('fOpsiLabel');
  var f = document.getElementById('fOpsi');
  if (!w || !l || !f) return;
  if (v === 'select') { w.classList.remove('d-none'); l.textContent = 'Pilihan (pisahkan koma)'; f.placeholder = 'mis. Roda dua,Roda empat'; }
  else if (v === 'repeater') { w.classList.remove('d-none'); l.textContent = 'Kolom daftar (pisahkan koma)'; f.placeholder = 'mis. nama,nip'; }
  else { w.classList.add('d-none'); }
}

/* ================= SCROLL HINT v2 (anti-loop, tahan re-render) ================= */
function neoBindScrollHint(container) {
  if (!container || container.__neoScrollBound) return;
  container.__neoScrollBound = true;
  var parent = container.parentNode;
  if (!parent) return;
  parent.classList.add('neo-scroll-parent');
  var hint = document.createElement('div');
  hint.className = 'neo-scroll-hint';
  parent.appendChild(hint);

  var lastHtml = null, lastCls = null;
  function update() {
    var overV = container.scrollHeight > container.clientHeight + 4;
    var overH = container.scrollWidth > container.clientWidth + 4;
    var html = '', cls = 'neo-scroll-hint';
    if (overV || overH) {
      var endV = !overV || (container.scrollTop + container.clientHeight >= container.scrollHeight - 8);
      var endH = !overH || (container.scrollLeft + container.clientWidth >= container.scrollWidth - 8);
      if (!(endV && endH)) {
        html = (overH && !endH) ? '<i class="bi bi-chevron-right"></i> geser' : '<i class="bi bi-chevron-down"></i> scroll';
        cls += ' show';
      }
    }
    if (html !== lastHtml) { hint.innerHTML = html; lastHtml = html; }
    if (cls !== lastCls) { hint.className = cls; lastCls = cls; }
  }

  container.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  new MutationObserver(function (muts) {
    var rel = muts.some(function (m) { return !(m.target === hint || hint.contains(m.target)); });
    if (rel) update();
  }).observe(container, { childList: true, subtree: true });
  setTimeout(update, 300);
  setTimeout(update, 1200);
}

/* ================= GUARD TUTUP FORM ================= */
function neoGuardModal(modalId, flagName) {
  var mEl = document.getElementById(modalId);
  if (!mEl || mEl.__neoGuarded) return;
  mEl.__neoGuarded = true;
  var bypass = false;
  mEl.addEventListener('hide.bs.modal', function (e) {
    if (bypass) { bypass = false; return; }
    if (window[flagName] === true) {
      e.preventDefault();
      NeoDialog.show({
        icon: 'warning',
        title: 'Tutup tanpa menyimpan?',
        text: 'Isian yang belum disimpan akan hilang.',
        confirmButtonText: 'Tutup & Buang',
        cancelButtonText: 'Kembali ke Form',
        showCancelButton: true
      }, function (r) {
        if (r.isConfirmed) {
          bypass = true;
          window[flagName] = false;
          var inst = bootstrap.Modal.getInstance(mEl);
          if (inst) inst.hide();
        }
      });
    }
  });
  mEl.addEventListener('shown.bs.modal', function () { window[flagName] = false; });
}

/* ================= INIT ================= */
(function () {
  function init() {
    neoEnsureCss(); neoEnsureUxCss();

    var s = document.createElement('style');
    s.id = 'neoFixDnone';
    s.textContent = '.d-none{display:none!important}button.d-none{display:none!important}.dsc-btn-primary.d-none{display:none!important}.btn-guest-action.d-none{display:none!important}';
    document.head.appendChild(s);

    ['https://fonts.googleapis.com', 'https://fonts.gstatic.com', 'https://cdn.jsdelivr.net'].forEach(function (u) {
      if (!document.querySelector('link[rel="preconnect"][href="' + u + '"]')) {
        var l = document.createElement('link');
        l.rel = 'preconnect';
        l.href = u;
        if (u === 'https://fonts.gstatic.com') l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      }
    });

    document.addEventListener('input', function (e) {
      var t = e.target;
      if (!t || !t.matches) return;
      if (t.closest && t.closest('#formSurat')) window.__formDirty = true;
      if (t.closest && t.closest('#modalKategori')) window.__katDirty = true;
      if (t.matches('textarea.form-control')) neoFit(t);
      if (t.matches('input.form-control')) t.title = t.value || '';
      if (t.matches('.search-input-clean')) {
        var ch = Math.min(60, Math.max(26, (t.value || '').length + 10));
        t.style.setProperty('width', ch + 'ch', 'important');
      }
    });

    document.addEventListener('shown.bs.modal', function (e) {
      if (e.target) neoFitTextareas(e.target);
      bindScrollHints();
    });

    var raf = 0;
    var mo = new MutationObserver(function () {
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; neoFitTextareas(document); });
    });
    mo.observe(document.body, { childList: true, subtree: true });

    neoGuardModal('modalTambahSurat', '__formDirty');
    neoGuardModal('modalKategori', '__katDirty');

    function bindScrollHints() {
      ['#sidebarAgendaList', '.page-content-scroll', '.table-responsive', '#pickerGrid', '#autoFillList', '#katListContainer', '#fieldListContainer'].forEach(function (sel) {
        document.querySelectorAll(sel).forEach(function (c) { neoBindScrollHint(c); });
      });
      document.querySelectorAll('.modal-inner-card').forEach(function (c) { neoBindScrollHint(c); });
    }
    bindScrollHints();
    setTimeout(bindScrollHints, 800);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

/* ================= LOADER ================= */
var Loader = (function () {
  function show(text) {
    hide(); neoEnsureCss();
    var el = document.createElement('div');
    el.id = 'neoLoader';
    el.innerHTML = '<div class="neo-loader-card"><div class="spinner-circle"><span class="spinner-icon"><i class="bi bi-arrow-repeat"></i></span></div><div class="loading-text">' + (text || 'Memproses...') + '</div></div>';
    document.body.appendChild(el);
  }
  function hide() { var e = document.getElementById('neoLoader'); if (e && e.parentNode) e.parentNode.removeChild(e); }
  return { show: show, hide: hide };
})();

/* ================= NOTIFY ================= */
var Notify = (function () {
  var ICONS = { success: 'bi-check-circle-fill', error: 'bi-x-circle-fill', warning: 'bi-exclamation-triangle-fill', question: 'bi-question-circle-fill', info: 'bi-info-circle-fill' };
  var COLORS = { success: 'var(--neo-status-active)', error: 'var(--neo-status-inactive)', warning: '#f59e0b', question: 'var(--neo-accent)', info: 'var(--neo-accent)' };
  function show(icon, title, text) {
    neoEnsureCss();
    var wrap = document.createElement('div');
    wrap.className = 'neo-notify';
    wrap.innerHTML = '<div class="neo-swal-popup neo-notify-card"><div class="neo-swal-inner">' +
      '<div class="neo-swal-icon" style="color:' + (COLORS[icon] || 'var(--neo-accent)') + '"><i class="bi ' + (ICONS[icon] || 'bi-info-circle-fill') + '"></i></div>' +
      (title ? '<div class="neo-swal-title">' + title + '</div>' : '') +
      (text ? '<div class="neo-swal-text">' + text + '</div>' : '') +
      '</div></div>';
    document.body.appendChild(wrap);
    setTimeout(function () {
      wrap.classList.add('out');
      setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 300);
    }, 2400);
  }
  return { show: show, ICONS: ICONS, COLORS: COLORS };
})();

/* ================= NEODIALOG ================= */
var NeoDialog = (function () {
  function show(opts, settle) {
    neoEnsureCss();
    var icon = opts.icon || 'question';
    var ov = document.createElement('div');
    ov.className = 'neo-dialog';
    ov.innerHTML = '<div class="neo-swal-popup neo-dialog-card"><div class="neo-swal-inner">' +
      '<div class="neo-swal-icon" style="color:' + (Notify.COLORS[icon] || 'var(--neo-accent)') + '"><i class="bi ' + (Notify.ICONS[icon] || 'bi-question-circle-fill') + '"></i></div>' +
      (opts.title ? '<div class="neo-swal-title">' + opts.title + '</div>' : '') +
      (opts.text ? '<div class="neo-swal-text">' + opts.text + '</div>' : '') +
      (opts.html ? '<div class="neo-swal-text">' + opts.html + '</div>' : '') +
      '</div><div class="neo-dialog-actions">' +
      (opts.showConfirmButton !== false ? '<button type="button" class="neo-btn-confirm">' + (opts.confirmButtonText || 'Ya') + '</button>' : '') +
      (opts.showCancelButton ? '<button type="button" class="neo-btn-cancel">' + (opts.cancelButtonText || 'Batal') + '</button>' : '') +
      '</div></div>';
    document.body.appendChild(ov);
    var done = false;
    function close(result) {
      if (done) return; done = true;
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      settle(result);
    }
    var c = ov.querySelector('.neo-btn-confirm');
    var b = ov.querySelector('.neo-btn-cancel');
    if (c) c.onclick = function () { close({ isConfirmed: true, value: true }); };
    if (b) b.onclick = function () { close({ isConfirmed: false, value: false }); };
    if (!c && !b) setTimeout(function () { close({ isConfirmed: false, value: false }); }, opts.timer || 2500);
  }
  return { show: show };
})();

/* ================= THENABLE & PATCH Swal ================= */
function neoThenable(resolver) {
  var settled = false, result = null, cbs = [];
  function settle(r) { settled = true; result = r; cbs.forEach(function (cb) { cb(r); }); }
  resolver(settle);
  return { then: function (cb) { if (typeof cb === 'function') { if (settled) cb(result); else cbs.push(cb); } return this; } };
}

if (typeof Swal !== 'undefined') {
  Swal.fire = function (opts) {
    opts = opts || {};
    var isDialog = (opts.showCancelButton === true) || (opts.showConfirmButton === true);
    if (!isDialog) {
      Notify.show(opts.icon || 'info', opts.title || '', opts.text || opts.html || '');
      return neoThenable(function (settle) { setTimeout(function () { settle({ isConfirmed: false, value: false }); }, 2400); });
    }
    return neoThenable(function (settle) { NeoDialog.show(opts, settle); });
  };
}
</script>
