<section id="sec-kalendar">

  <!-- ============ TOOLBAR: NAV + SEARCH ============ -->
  <div class="calendar-header-row">
    <div class="d-flex align-items-center gap-3">
      <button class="calendar-nav-btn" onclick="switchPage('page-dashboard')" title="Kembali ke Dashboard">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h2 class="calendar-month-title" id="calendarMonthYearTitle">Agustus 2026</h2>
    </div>
    <div class="d-flex align-items-center gap-2">
      <input type="text" id="calendarSearchInput" class="search-input-clean" style="width: 220px !important;" placeholder="Cari perihal / tempat..." onkeyup="renderConventionalCalendar()">
      <button class="calendar-nav-btn" onclick="prevMonth()" title="Bulan Sebelumnya">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button class="calendar-nav-btn" onclick="nextMonth()" title="Bulan Berikutnya">
        <i class="bi bi-chevron-right"></i>
      </button>
      <button class="calendar-nav-btn" onclick="goToToday()" title="Hari Ini" style="color: var(--neo-accent);">
        <i class="bi bi-crosshair"></i>
      </button>
    </div>
  </div>

  <!-- ============ DAY HEADERS ============ -->
  <div class="calendar-grid" style="margin-bottom: 10px;">
    <div class="calendar-day-header">Sen</div>
    <div class="calendar-day-header">Sel</div>
    <div class="calendar-day-header">Rab</div>
    <div class="calendar-day-header">Kam</div>
    <div class="calendar-day-header">Jum</div>
    <div class="calendar-day-header">Sab</div>
    <div class="calendar-day-header" style="color: var(--neo-status-inactive);">Min</div>
  </div>

  <!-- ============ CALENDAR GRID ============ -->
  <div id="calendarGridDays" class="calendar-grid" style="max-height: calc(100vh - 320px); overflow-y: auto; padding-right: 4px;">
    <!-- Rendered by JS_Render -->
  </div>

  <!-- ============ LEGEND ============ -->
  <div class="d-flex align-items-center gap-3" style="margin-top: 1rem; flex-wrap: wrap;">
    <div class="d-flex align-items-center gap-2" style="font-size: 0.7rem; font-weight: 700; color: var(--neo-text-sub);">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--neo-accent); box-shadow: 0 0 8px rgba(102,126,234,0.6);"></span>
      Hari Ini
    </div>
    <div class="d-flex align-items-center gap-2" style="font-size: 0.7rem; font-weight: 700; color: var(--neo-text-sub);">
      <span style="width: 14px; height: 10px; border-radius: 4px; background: var(--neo-accent-soft); border: 1px solid rgba(102,126,234,0.3);"></span>
      Ada Kegiatan
    </div>
    <div class="d-flex align-items-center gap-2" style="font-size: 0.7rem; font-weight: 700; color: var(--neo-text-sub);">
      <span style="width: 14px; height: 10px; border-radius: 4px; background: transparent; border: 1px dashed rgba(163,177,198,0.5);"></span>
      Bulan Lain
    </div>
  </div>

</section>
